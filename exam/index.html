<!doctype html>

<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'none'; upgrade-insecure-requests">

<title>محاكاة اختبار التأهيل | المصدر والمستلم</title>
<meta name="description" content="محاكاة اختبار لجنة التأهيل لتصاريح العمل للمصدر والمستلم: نظري، واختيار التصاريح، وكتابة تصريح عمل، ودرجة نهائية مع مراجعة الأخطاء. بالعربية والإنجليزية.">
<meta property="og:type" content="website">
<meta property="og:title" content="محاكاة اختبار لجنة التأهيل | المصدر والمستلم">
<meta property="og:description" content="اختبر نفسك كأنك أمام اللجنة: نظري + عملي + درجة نهائية مع المراجع.">
<meta property="og:url" content="https://enganas1.github.io/safety/exam/">
<meta property="og:image" content="https://enganas1.github.io/safety/img/share.jpg">
<meta property="og:image:width" content="1200">

<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1EA; --sheet:#FFFFFF; --ink:#13213D; --ink2:#43506B; --mute:#7A8499;
  --rule:#DCD6C8; --rule2:#E9E4D8; --navy:#0E2A5C; --accent:#0E7C66; --accentBg:#E3F2EE;
  --red:#B3261E; --redBg:#FBE9E7; --amber:#9A6700; --amberBg:#FFF4D6; --focus:#1F6FD1;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:"Zain",system-ui,sans-serif;font-size:18px;line-height:1.6;min-height:100vh;
  background-image:linear-gradient(var(--rule2) 1px,transparent 1px);background-size:100% 34px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[dir=ltr],.mono{font-family:var(--mono)}

/* header */
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:4px solid var(--accent)}
.bwrap{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.98rem;line-height:1.25}
.seal{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;font-weight:600}
.lbtn{border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:4px 16px;font-weight:700;font-size:.9rem}
.lbtn:hover{background:rgba(255,255,255,.12)}
.timer{font-family:var(--mono);font-weight:600;font-size:1.15rem;background:rgba(255,255,255,.12);border-radius:10px;padding:4px 12px;letter-spacing:.04em;direction:ltr}
.timer.low{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}

main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:22px;box-shadow:0 1px 0 var(--rule),0 10px 30px -18px rgba(19,33,61,.25)}
.card+.card{margin-top:18px}
h1{font-weight:900;font-size:clamp(1.7rem,4.6vw,2.6rem);line-height:1.2;color:var(--navy)}
h2,.sh{font-weight:900;font-size:1.25rem;color:var(--navy)}
h3{font-weight:800;font-size:1.05rem}
.kick{font-weight:800;color:var(--accent);font-size:.92rem;letter-spacing:.02em}
.hint{color:var(--mute);font-size:.92rem;margin:2px 0 12px}

/* intro */
.intro{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.cover{padding:8px 2px}
.lead{margin-top:10px;color:var(--ink2);font-size:1.06rem}
.note{margin-top:14px;background:var(--amberBg);color:var(--amber);border:1px solid #F0D58A;border-radius:10px;padding:9px 13px;font-weight:800;font-size:.95rem}
.rules{margin-top:16px;padding-inline-start:0;list-style:none;counter-reset:r;display:grid;gap:8px}
.rules li{counter-increment:r;display:flex;gap:10px;align-items:flex-start;color:var(--ink2)}
.rules li::before{content:counter(r);flex:none;width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;margin-top:2px}
.cand h2{border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:14px}
.fld{display:block;border:0;margin-bottom:16px}
.fld>span,.fld legend{display:block;font-weight:800;font-size:.95rem;margin-bottom:6px}
.fld input:not([type]){width:100%;border:0;border-bottom:2px dashed var(--rule);background:transparent;padding:8px 2px;font-size:1.05rem}
.fld input:not([type]):focus{outline:0;border-bottom-color:var(--focus)}
.fld input::placeholder{color:#A5ACBA;font-size:.88rem}
.radio{display:flex;align-items:center;gap:10px;border:1.5px solid var(--rule);border-radius:10px;padding:9px 12px;margin-bottom:8px;cursor:pointer}
.radio:has(input:checked){border-color:var(--navy);background:#EEF2FA}
.radio input{accent-color:var(--navy);width:18px;height:18px}
.disc{grid-column:1/-1;margin-top:18px;color:var(--mute);font-size:.85rem;text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);border-radius:10px;padding:8px 18px;font-weight:800;text-decoration:none;color:var(--ink);background:var(--sheet);min-height:44px}
.btn:hover{background:#F1EEE6}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#163A7A}
.btn.big{width:100%;font-size:1.1rem;padding:12px}
.btn.sm{min-height:34px;padding:3px 12px;font-size:.88rem}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* section steps */
.steps{display:flex;gap:8px;margin-bottom:16px}
.st{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 8px;border-radius:10px;border:1.5px solid var(--rule);background:var(--sheet);font-weight:800;color:var(--mute)}
.st b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--rule2);font-family:var(--mono);font-size:.8rem}
.st.on{border-color:var(--navy);color:var(--navy)}
.st.on b{background:var(--navy);color:#fff}
.st.past b{background:var(--accent);color:#fff}

/* theory */
.qwrap{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:14px}
.qn{font-weight:900;color:var(--navy);font-size:1.05rem}
.qn i{font-style:normal;color:var(--mute);font-weight:700;font-size:.9rem}
.flagb{border:1.5px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:800;color:var(--mute)}
.flagb.on{border-color:var(--amber);color:var(--amber);background:var(--amberBg)}
.qt{font-size:1.2rem;font-weight:800;line-height:1.55;margin-bottom:16px;min-height:2.4em}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--rule);border-radius:12px;padding:11px 13px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:#B8B09E}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ol{flex:none;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:900;color:var(--ink2);font-size:.95rem}
.opt.on{border-color:var(--navy);background:#EEF2FA}
.opt.on .ol{background:var(--navy);border-color:var(--navy);color:#fff}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.opts.compact .opt{padding:8px 11px}
.opts.compact .ol{width:26px;height:26px;font-size:.85rem}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.qnav.end{justify-content:flex-end}
.pal{position:sticky;top:84px}
.pal h3{font-size:.95rem;margin-bottom:10px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1.5px solid var(--rule);border-radius:8px;font-family:var(--mono);font-size:.82rem;font-weight:600;color:var(--mute);position:relative}
.cell.ans{background:var(--navy);border-color:var(--navy);color:#fff}
.cell.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.cell.flg::after{content:"";position:absolute;top:-4px;inset-inline-end:-4px;width:10px;height:10px;border-radius:50%;background:#E8A400;border:2px solid var(--sheet)}
.lockbox{display:flex;justify-content:center;margin:-4px 0 16px}
.lockimg{width:118px;height:auto;filter:drop-shadow(0 8px 10px rgba(19,33,61,.25))}
.lockbox.sm .lockimg{width:56px}

/* permits */
.pcase{border-top:1px dashed var(--rule);padding:14px 0}
.pq{font-weight:800;margin-bottom:10px}
.pq b{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:0 9px;margin-inline-end:8px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative;border:1.5px solid var(--rule);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.88rem;font-weight:600}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}

/* practical form */
.form{border-top:6px solid var(--navy)}
.formhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ftag{background:var(--red);color:#fff;font-weight:600;border-radius:6px;padding:2px 10px;font-size:.9rem}
.brief{background:#F7F5EF;border:1px solid var(--rule);border-inline-start:5px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.brief b{color:var(--accent);font-size:.9rem}
.brief p{color:var(--ink2);font-size:.98rem}
.ff{border-top:1px solid var(--rule2);padding:14px 0 6px}
.fl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.fl span{font-weight:900;color:var(--navy)}
.fl em{font-style:normal;font-size:.8rem;color:var(--mute);white-space:nowrap}
.spb{margin-top:14px}
.sphead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.splist{list-style:none;display:grid;gap:7px}
.sp{width:100%;display:flex;align-items:center;gap:12px;text-align:start;border:1.5px dashed #BDB6A6;border-radius:10px;padding:9px 12px;background:#FCFBF8;min-height:46px}
.sp .spn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px dashed #BDB6A6;display:grid;place-items:center;font-family:var(--mono);font-weight:600}
.sp.on{border-style:solid;border-color:var(--navy);background:#EEF2FA}
.sp.on .spn{background:var(--navy);border:0;color:#fff}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(19,33,61,.5);display:grid;place-items:center;padding:16px}
.mbox{background:var(--sheet);border-radius:14px;padding:22px;max-width:420px;width:100%;font-weight:700}
.warn{margin-top:10px;background:var(--amberBg);color:var(--amber);border-radius:8px;padding:6px 12px;font-weight:800}

/* result */
.sheet{border-top:6px solid var(--navy)}
.shead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.meta{color:var(--ink2);margin-top:6px;font-size:.95rem}
.stamp{flex:none;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;border:5px double currentColor;transform:rotate(-12deg);font-weight:900;font-size:1.25rem;text-align:center;line-height:1.1;padding:10px}
.stamp.pass{color:var(--accent)}
.stamp.fail{color:var(--red)}
.big{display:flex;align-items:baseline;gap:14px;margin:12px 0 16px;flex-wrap:wrap}
.big b{font-family:"Zain",sans-serif;font-size:3.6rem;font-weight:900;color:var(--navy);line-height:1}
.big span{color:var(--mute);font-weight:700}
.sb{margin:10px 0}
.sbl{display:flex;justify-content:space-between;font-weight:800;font-size:.95rem}
.sbt{height:10px;border-radius:99px;background:var(--rule2);overflow:hidden;margin-top:4px}
.sbt i{display:block;height:100%;background:var(--navy);border-radius:99px}
.seg{display:flex;border:1.5px solid var(--navy);border-radius:10px;overflow:hidden}
.seg button{padding:4px 12px;font-weight:800;font-size:.88rem;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}
.rh{margin:18px 0 8px;color:var(--accent)}
.rvl{list-style:none;display:grid;gap:9px}
.rv{display:flex;gap:12px;border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.rv.bad{border-color:#EFC2BD;background:var(--redBg)}
.rv.ok{border-color:#BFE0D7;background:var(--accentBg)}
.rk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:var(--red)}
.rv.ok .rk{background:var(--accent)}
.rq{font-weight:800}
.ry,.rc,.rr{font-size:.93rem;margin-top:4px;color:var(--ink2)}
.rc b{color:var(--accent)}
.ry b{color:var(--red)}
.rr{color:var(--mute);font-size:.82rem}
.mini{padding-inline-start:22px;margin-top:2px}

@media (max-width:820px){
  .intro{grid-template-columns:1fr}
  .qwrap{grid-template-columns:1fr}
  .pal{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:520px){
  body{font-size:17px}
  main{padding:14px 12px 50px}
  .card{padding:16px}
  .brand>span:last-child{font-size:.85rem}
  .st{flex-direction:column;gap:2px;font-size:.85rem;padding:7px 4px}
  .qt{font-size:1.1rem}
  .grid{grid-template-columns:repeat(6,1fr)}
  .stamp{width:96px;height:96px;font-size:1rem}
  .big b{font-size:2.7rem}
  .qnav .btn{flex:1}
}
@media print{
  body{background:#fff}
  .bar,.qnav,.seg,.disc{display:none!important}
  .card{box-shadow:none;break-inside:avoid-page}
}
</style>
</head>
