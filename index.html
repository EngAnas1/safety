<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1430">
<title>Safety Awareness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero-m.webp" media="(max-width:760px)">
<link rel="preload" as="image" href="img/hero.webp" media="(min-width:761px)">
<script src="content.js"></script>
<style>
/* =====================================================================
   الألوان — مأخوذة من المقطع والرسمة. غيّرها هنا فقط
   ===================================================================== */
:root{
  --night:#0B1430;     /* أعمق خلفية */
  --dusk:#14254F;      /* البطاقات */
  --sky:#254563;       /* سماء الغروب */
  --royal:#0A2E89;
  --teal:#05CEB3;
  --lime:#D7FF3C;      /* لون السترة العاكسة — لون التمييز */
  --glow:#FF9A4D;      /* وهج الأفق */
  --red:#FF4D57;
  --text:#EAF2FF;
  --muted:#9DB1D6;
  --line:rgba(157,177,214,.18);
  --silver:#C9D2DC;
  --display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--night);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:17px;line-height:1.7;min-height:100vh;overflow-x:hidden}
body.ur{font-family:"Noto Nastaliq Urdu","IBM Plex Sans Arabic",serif;font-size:15.5px;line-height:2.35}
body.ur{--display:"Noto Nastaliq Urdu",serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
img{display:block;max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;font-weight:400}
.display{font-family:var(--display);font-weight:900;letter-spacing:-.01em}
body.ur .display{font-weight:700;letter-spacing:0}

/* ---------- Signature: hi-vis reflective stripe ---------- */
.stripe{height:12px;background:linear-gradient(var(--lime) 0 32%,var(--silver) 32% 68%,var(--lime) 68%);box-shadow:0 0 24px rgba(215,255,60,.25)}
.stripe.thin{height:7px}

/* ---------- Top bar ---------- */
.top{position:absolute;top:0;inset-inline:0;z-index:10}
.top.solid{position:sticky;background:rgba(11,20,48,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.05rem}
body.ur .logo{font-weight:700;font-size:.95rem}
.logo .m{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--lime);font-size:19px;box-shadow:0 0 18px rgba(215,255,60,.35)}
.lang{display:flex;gap:4px;background:rgba(11,20,48,.55);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.lang button{padding:3px 12px;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--lime);color:var(--night)}
.lang .ur{font-family:"Noto Nastaliq Urdu",serif;padding-block:0}

/* ---------- Home hero: Anas points at the headline ---------- */
.hero{position:relative;background:var(--night)}
.hero .art{position:relative;max-height:94vh;aspect-ratio:2000/1116;margin:0 auto;overflow:hidden}
.hero .art picture,.hero .art img{width:100%;height:100%;object-fit:cover}
.hero .art::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:linear-gradient(transparent,var(--night))}
.hero .copy{position:absolute;left:14%;top:14%;width:34.5%;height:62%;display:flex;flex-direction:column;justify-content:center;padding:3% 4%;text-align:start}
.hero h1{font-size:clamp(2rem,4.3vw,4.4rem);line-height:1.05;color:var(--text);text-wrap:balance}
body.ur .hero h1{line-height:1.7;font-size:clamp(1.6rem,3vw,3rem)}
.hero h1 .w{display:inline-block;animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both}
.hero p{margin-top:16px;color:var(--muted);font-size:clamp(.95rem,1.3vw,1.15rem);max-width:34ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--lime);color:var(--night);font-family:var(--display);font-weight:800;padding:13px 22px;border-radius:14px;box-shadow:0 10px 30px -10px rgba(215,255,60,.55);transition:transform .12s}
body.ur .btn{font-weight:700;padding:6px 22px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(11,20,48,.5);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600}
.chip b{color:var(--lime)}
@keyframes rise{from{opacity:0;transform:translateY(40%)}to{opacity:1;transform:none}}

@media (max-width:760px){
  .hero .art{aspect-ratio:auto;max-height:none}
  .hero .art img{aspect-ratio:800/812;height:auto}
  .hero .copy{position:relative;left:auto;top:auto;width:auto;height:auto;margin-top:-90px;padding:0 18px 8px;z-index:2}
  .hero .art::after{height:45%}
  .hero h1{font-size:clamp(2.4rem,11vw,3.4rem)}
  body.ur .hero h1{font-size:clamp(1.9rem,8vw,2.6rem)}
}

/* ---------- Section heads ---------- */
.sec{padding:42px 0 8px}
.sec h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.2;margin-bottom:18px}
body.ur .sec h2{font-weight:700;line-height:1.9}

/* ---------- Tip of the day ---------- */
.tip{position:relative;display:flex;gap:18px;align-items:center;background:linear-gradient(100deg,rgba(255,154,77,.18),var(--dusk) 55%);border:1px solid var(--line);border-radius:22px;padding:20px 22px;overflow:hidden}
.tip .emoji{font-size:44px;flex-shrink:0}
.tip small{display:block;color:var(--glow);font-weight:700;font-size:.85rem}
.tip p{font-size:1.1rem;font-weight:600;line-height:1.55}
body.ur .tip p{line-height:2.2}

/* ---------- Mission cards ---------- */
.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.missions{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.missions{grid-template-columns:1fr}}
.mcard{position:relative;display:flex;flex-direction:column;gap:12px;min-height:220px;padding:20px;border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(37,69,99,.95),var(--dusk) 60%);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.mcard:hover{transform:translateY(-4px);border-color:rgba(215,255,60,.6)}
.mcard .no{font-family:"Alexandria",sans-serif;font-weight:900;font-size:4.2rem;line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(157,177,214,.35)}
.mcard .big{position:absolute;inset-inline-end:16px;top:16px;font-size:58px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.mcard h3{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.25;margin-top:auto}
body.ur .mcard h3{font-weight:700;line-height:1.9;font-size:1.15rem}
.mcard .bar{height:6px;border-radius:6px;background:rgba(157,177,214,.18);overflow:hidden}
.mcard .bar i{display:block;height:100%;background:var(--lime);border-radius:6px}
.mcard .st{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted)}
.mcard.done{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime),0 18px 40px -20px rgba(215,255,60,.5)}
.mcard.done .st b{color:var(--lime)}
.mcard.lead{grid-column:span 2;background:linear-gradient(120deg,rgba(5,206,179,.25),transparent 55%),radial-gradient(120% 90% at 100% 0%,var(--royal),var(--dusk) 65%)}
@media (max-width:520px){.mcard.lead{grid-column:auto}}
.mcard.lead .big{font-size:84px}

/* ---------- Badges ---------- */
.badges{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hex{width:74px;height:84px;display:grid;place-items:center;font-size:32px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(157,177,214,.14);position:relative}
.hex.on{background:var(--lime);box-shadow:none}
.hex:not(.on) .emoji{filter:grayscale(1) opacity(.35)}
.hex:not(.on)::after{content:"🔒";position:absolute;font-size:16px;bottom:14px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.prog{margin-inline-start:auto;text-align:end}
.prog b{display:block;font-family:"Alexandria",sans-serif;font-weight:900;font-size:2.2rem;line-height:1;color:var(--lime)}
.prog span{color:var(--muted);font-size:.9rem}
@media (max-width:560px){.prog{margin-inline-start:0;width:100%;text-align:start}}
.hero-msg{margin-top:12px;color:var(--lime);font-family:var(--display);font-weight:800}

/* ---------- Creator ---------- */
.creator{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) 1.1fr;gap:0;align-items:stretch;border-radius:28px;overflow:hidden;background:linear-gradient(120deg,var(--dusk),var(--night));border:1px solid var(--line);margin-top:10px}
@media (max-width:700px){.creator{grid-template-columns:1fr}}
.creator img{width:100%;height:100%;object-fit:cover;min-height:320px}
.creator .txt{padding:34px 30px;display:flex;flex-direction:column;justify-content:center}
.creator small{color:var(--teal);font-weight:700}
.creator h3{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:6px 0 14px}
body.ur .creator h3{line-height:1.8}
.creator p{color:var(--muted);font-size:1.1rem;max-width:30ch}
.creator .stripe{margin-top:22px;width:140px;border-radius:3px}

footer{padding:30px 0 44px;color:var(--muted);font-size:.85rem;text-align:center}

/* ---------- Topic page ---------- */
.thero{position:relative;padding:34px 0 28px;overflow:hidden;background:radial-gradient(90% 120% at 85% 0%,var(--sky),var(--night) 70%)}
.thero::before{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(255,154,77,.10))}
.thero .ghost{position:absolute;inset-inline-end:-30px;top:10px;font-size:220px;opacity:.16;transform:rotate(-8deg);pointer-events:none}
.thero .wrap{position:relative}
.kick{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:.9rem;color:var(--lime)}
.kick span{color:var(--muted);font-weight:500}
.thero h1{font-size:clamp(2.3rem,8vw,4.6rem);line-height:1.05;margin:10px 0 12px;max-width:16ch}
body.ur .thero h1{line-height:1.7;font-size:clamp(1.9rem,6vw,3.4rem)}
.thero p{color:var(--muted);font-size:1.12rem;max-width:44ch}
.meter{display:flex;align-items:center;gap:14px;margin-top:22px;max-width:520px}
.meter .bar{flex:1;height:10px;border-radius:10px;background:rgba(157,177,214,.18);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--lime));border-radius:10px;transition:width .4s}
.meter b{font-family:"Alexandria",sans-serif;font-weight:900;font-size:1.2rem;min-width:3.4em;text-align:end}

.frame{position:relative;margin:26px 0 8px;border-radius:18px;padding:10px;background:rgba(157,177,214,.06)}
.frame .player{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#050A1C}
.frame video,.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050A1C}
.frame .empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);text-align:center;background:radial-gradient(circle,var(--dusk),#050A1C)}
.frame .empty .emoji{font-size:44px}
.frame i.c{position:absolute;width:30px;height:30px;border:4px solid var(--lime)}
.frame i.c1{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:16px}
.frame i.c2{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:16px}
.frame i.c3{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:16px}
.frame i.c4{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:16px}

.hint{display:flex;align-items:center;gap:10px;color:var(--muted);margin:26px 0 12px;font-weight:600}
.hint::before{content:"👆";font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

.cards{display:grid;gap:12px}
@media (min-width:860px){.cards.rules{grid-template-columns:1fr 1fr}}
.ck{position:relative;display:block;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;width:100%;text-align:start;background:var(--dusk);border:1.5px solid var(--line);border-radius:20px;padding:18px 18px 18px;transition:border-color .15s,background .15s}
.ck:hover{border-color:rgba(215,255,60,.45)}
.ck .tick{position:absolute;inset-inline-end:16px;top:16px;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;color:transparent;transition:.2s}
.ck.on{border-color:var(--lime);background:linear-gradient(160deg,rgba(215,255,60,.10),var(--dusk) 60%)}
.ck.on .tick{background:var(--lime);border-color:var(--lime);color:var(--night);transform:scale(1.08)}
.ck header{display:flex;align-items:center;gap:14px;padding-inline-end:40px}
.ck .n{font-family:"Alexandria",sans-serif;font-weight:900;font-size:2.6rem;line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--teal);min-width:1.3em}
.ck.on .n{-webkit-text-stroke-color:var(--lime)}
.ck .ic{font-size:30px}
.ck h3{font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.3}
body.ur .ck h3{font-weight:700;line-height:1.9;font-size:1.05rem}
.ck ul{list-style:none;display:grid;gap:6px;margin-top:12px}
.ck li{display:flex;gap:10px;align-items:flex-start;font-size:.97rem}
.ck li::before{flex-shrink:0;width:20px;height:20px;margin-top:.35em;border-radius:6px;display:grid;place-items:center;font-size:.7rem;font-weight:900}
body.ur .ck li::before{margin-top:.6em}
.ck li.yes::before{content:"✓";background:var(--teal);color:var(--night)}
.ck li.no::before{content:"✕";background:var(--red);color:#fff}
.ck li.info::before{content:"";width:8px;height:8px;margin:.75em 6px 0;background:var(--muted);border-radius:2px}
body.ur .ck li.info::before{margin-top:1.15em}
.ck li.no{color:#FFC4C8}
.ck.pt{display:flex;gap:14px;align-items:center;padding-inline-end:58px}
.ck.pt .ic{font-size:30px}

.dd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:560px){.dd{grid-template-columns:1fr}}
.dd > div{border-radius:20px;padding:16px 18px;background:var(--dusk);border-top:5px solid}
.dd .do{border-color:var(--teal)} .dd .dont{border-color:var(--red)}
.dd h3{font-family:var(--display);font-weight:800;margin-bottom:8px}
.dd ul{list-style:none;display:grid;gap:6px}
.dd li{display:flex;gap:8px}
.dd .do li::before{content:"✅"} .dd .dont li::before{content:"❌"}

.stop{display:flex;gap:16px;align-items:center;margin-top:24px;padding:18px 20px;border-radius:20px;background:linear-gradient(100deg,rgba(255,77,87,.22),var(--dusk) 70%);border:1px solid rgba(255,77,87,.45);font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.4}
body.ur .stop{font-weight:700;line-height:2}
.oct{width:54px;height:54px;flex-shrink:0;display:grid;place-items:center;background:var(--red);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);font-size:24px}

/* badge unlock: the one celebratory moment */
.unlock{position:relative;margin:30px 0 10px;padding:26px 20px;border-radius:26px;background:radial-gradient(80% 120% at 50% 0%,rgba(215,255,60,.12),var(--dusk) 70%);border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.unlock .hex{width:110px;height:124px;font-size:50px;transition:transform .3s}
.unlock .hex:not(.on)::after{font-size:22px;bottom:20px}
.unlock .btn[disabled]{background:rgba(157,177,214,.2);color:var(--muted);box-shadow:none;cursor:not-allowed;transform:none}
.unlock .msg{color:var(--muted);font-weight:600}
.unlock.done .msg{color:var(--lime);font-family:var(--display);font-weight:800;font-size:1.2rem}
.unlock.pop .hex{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
.burst{position:absolute;top:28%;left:50%;pointer-events:none}
.burst i{position:absolute;font-style:normal;font-size:26px;animation:fly 1s ease-out forwards;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

.nextm{display:flex;align-items:center;gap:16px;margin-top:16px;padding:18px 20px;border-radius:22px;background:linear-gradient(120deg,var(--royal),var(--dusk));border:1px solid var(--line);transition:transform .15s}
.nextm:hover{transform:translateY(-3px)}
.nextm .emoji{font-size:44px}
.nextm small{color:var(--lime);font-weight:700;display:block}
.nextm b{font-family:var(--display);font-weight:800;font-size:1.3rem}
body.ur .nextm b{font-weight:700}

.by{display:flex;align-items:center;gap:14px;justify-content:center;padding:34px 0 46px}
.by img{width:56px;height:56px;border-radius:50%;border:2px solid var(--lime);object-fit:cover}
.by small{display:block;color:var(--muted);font-size:.8rem}
.by b{font-family:var(--display);font-weight:800;font-size:1.15rem}
body.ur .by b{font-weight:700}

/* ---------- Language picker ---------- */
#picker{position:fixed;inset:0;z-index:40;background:var(--night);overflow:auto}
#picker .pin{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#picker .art{position:relative}
#picker .art img{width:100%;aspect-ratio:800/812;object-fit:cover;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
#picker .pc{padding:0 18px 30px;margin-top:-70px;position:relative}
#picker .t-ar{font-family:"Alexandria",sans-serif;font-weight:900;font-size:2rem;line-height:1.15}
#picker .t-en{font-family:"Alexandria",sans-serif;font-weight:700;color:var(--lime);margin-top:6px}
#picker .t-ur{font-family:"Noto Nastaliq Urdu",serif;color:var(--muted);line-height:2.3}
#picker .choose{display:grid;gap:10px;margin-top:18px}
#picker .choose button{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-radius:16px;background:var(--dusk);border:1.5px solid var(--line);font-family:"Alexandria",sans-serif;font-size:1.3rem;font-weight:800;transition:border-color .12s,transform .12s}
#picker .choose button:hover{border-color:var(--lime)}
#picker .choose button:active{transform:scale(.98)}
#picker .choose button small{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:.85rem;font-weight:500;color:var(--muted)}
#picker .choose .ur{font-family:"Noto Nastaliq Urdu",serif;font-weight:700;padding-block:8px}
@media (min-width:761px){#picker .pin{justify-content:center}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.burst{display:none}}
</style>
</head>
<body>

<div id="picker" hidden>
  <div class="pin">
    <div class="art"><img src="img/hero-m.webp" alt=""></div>
    <div class="pc">
      <div class="t-ar" id="pAr"></div>
      <div class="t-en" id="pEn"></div>
      <div class="t-ur" id="pUr"></div>
      <div class="choose">
        <button data-lang="ar"><span>العربية</span><small>اختر لغتك</small></button>
        <button data-lang="en"><span>English</span><small>Choose language</small></button>
        <button data-lang="ur" class="ur"><span>اردو</span><small>زبان منتخب کریں</small></button>
      </div>
    </div>
  </div>
</div>

<header class="top" id="top">
  <div class="wrap">
    <a class="logo" id="homeLink" href="./"><span class="m emoji">⛑️</span><span id="siteName"></span></a>
    <div class="lang">
      <button data-lang="ar">عربي</button>
      <button data-lang="en">EN</button>
      <button data-lang="ur" class="ur">اردو</button>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
const params = new URLSearchParams(location.search);
const topic = TOPICS.find(t => t.id === params.get("t"));
let lang = null;

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k,v) }catch(e){} }
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link = id => `?t=${id}&lang=${lang}`;
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);

/* Each topic's checklist: the ten rules, or the key points */
const itemsOf = t => t.rules ? t.rules.length : t.ar.points.length;
const checked = (t, i) => store.get(`chk:${t.id}:${i}`) === "1";
const countChecked = t => Array.from({length: itemsOf(t)}, (_, i) => checked(t, i)).filter(Boolean).length;
const hasBadge = t => store.get("pledge:" + t.id) === "1";

function ytId(url){
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function player(t, u){
  const src = (CONFIG.videos[t.id]?.[lang] || "").trim();
  const poster = CONFIG.posters?.[t.id]?.[lang] || "";
  if(!src) return `<div class="empty"><span class="emoji">🎬</span><span>${u.noVideo}</span></div>`;
  const y = ytId(src);
  if(y) return `<iframe src="https://www.youtube-nocookie.com/embed/${y}?rel=0&playsinline=1" title="video" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  return `<video src="${esc(src)}" ${poster ? `poster="${esc(poster)}"` : ""} controls playsinline preload="metadata"></video>`;
}

/* Tip of the day: changes every day, so there's something new on each visit */
function tipOfDay(){
  const pool = [];
  TOPICS.forEach(t => {
    if(t.rules) t.rules.forEach(r => r[lang].items.forEach(([ok, x]) => { if(ok !== null) pool.push([r.emoji, x]); }));
    else t[lang].points.forEach(p => pool.push(p));
  });
  const day = Math.floor(Date.now() / 864e5);
  return pool[day % pool.length];
}

/* ---------- Home ---------- */
function renderHome(u){
  document.title = u.site;
  const lead = TOPICS.find(t => t.rules) || TOPICS[0];
  const done = TOPICS.filter(hasBadge).length;
  const [tEmoji, tText] = tipOfDay();
  const words = u.heroTitle.split(" ").map((w, i) => `<span class="w" style="animation-delay:${.15 + i*.12}s">${esc(w)}</span>`).join(" ");
  return `
  <section class="hero">
    <div class="art">
      <picture>
        <source media="(max-width:760px)" srcset="img/hero-m.webp">
        <img src="img/hero.webp" srcset="img/hero-1200.webp 1200w, img/hero.webp 2000w" sizes="100vw" alt="${esc(CONFIG.ownerName[lang])}">
      </picture>
    </div>
    <div class="copy">
      <h1 class="display">${words}</h1>
      <p>${esc(u.heroSub)}</p>
      <div class="cta">
        <a class="btn" href="${link(lead.id)}"><span class="emoji">${lead.emoji}</span>${u.start}</a>
        <span class="chip"><span class="emoji">🏅</span><b>${done}/${TOPICS.length}</b></span>
      </div>
    </div>
  </section>
  <div class="stripe thin"></div>

  <div class="wrap">
    <section class="sec">
      <div class="tip"><span class="emoji">${tEmoji}</span><div><small>${u.tip}</small><p>${esc(tText)}</p></div></div>
    </section>

    <section class="sec">
      <h2>${u.missions}</h2>
      <div class="missions">${TOPICS.map((t, i) => {
        const n = countChecked(t), total = itemsOf(t), b = hasBadge(t);
        return `<a class="mcard ${t === lead ? "lead" : ""} ${b ? "done" : ""}" href="${link(t.id)}">
          <span class="no">${String(i+1).padStart(2,"0")}</span>
          <span class="big emoji">${t.emoji}</span>
          <h3>${esc(t[lang].title)}</h3>
          <div class="bar"><i style="width:${Math.round(n/total*100)}%"></i></div>
          <div class="st"><span>${fmt(u.progress, {n, t: total})}</span>${b ? `<b>✔ 🏅</b>` : ""}</div>
        </a>`;}).join("")}
      </div>
    </section>

    <section class="sec">
      <h2>${u.badges}</h2>
      <div class="badges">
        ${TOPICS.map(t => `<div class="hex ${hasBadge(t) ? "on" : ""}" title="${esc(t[lang].title)}"><span class="emoji">${t.emoji}</span></div>`).join("")}
        <div class="prog"><b>${done}/${TOPICS.length}</b><span>${fmt(u.progress, {n: done, t: TOPICS.length})}</span></div>
      </div>
      ${done === TOPICS.length ? `<div class="hero-msg">${u.allDone}</div>` : ""}
    </section>

    <section class="sec">
      <div class="creator">
        <img src="img/portrait.webp" alt="${esc(CONFIG.ownerName[lang])}" loading="lazy">
        <div class="txt">
          <small>${u.by}</small>
          <h3 class="display">${esc(CONFIG.ownerName[lang])}</h3>
          <p>${esc(CONFIG.ownerLine?.[lang])}</p>
          <div class="stripe"></div>
        </div>
      </div>
    </section>
  </div>
  <footer>${esc(CONFIG.siteTag?.[lang] || "")}</footer>`;
}

/* ---------- Topic ---------- */
function renderTopic(u){
  const c = topic[lang];
  document.title = c.title;
  const idx = TOPICS.indexOf(topic), next = TOPICS[(idx + 1) % TOPICS.length];
  const cards = topic.rules
    ? `<div class="cards rules">${topic.rules.map((r, i) => `
        <div class="ck ${checked(topic, i) ? "on" : ""}" role="button" tabindex="0" data-i="${i}" aria-pressed="${checked(topic, i)}">
          <span class="tick">✓</span>
          <header><span class="n">${i+1}</span><span class="ic emoji">${r.emoji}</span><h3>${esc(r[lang].t)}</h3></header>
          <ul>${r[lang].items.map(([ok, x]) => `<li class="${ok===true?"yes":ok===false?"no":"info"}">${esc(x)}</li>`).join("")}</ul>
        </div>`).join("")}</div>`
    : `<div class="cards">${c.points.map(([e, x], i) => `
        <div class="ck pt ${checked(topic, i) ? "on" : ""}" role="button" tabindex="0" data-i="${i}" aria-pressed="${checked(topic, i)}">
          <span class="tick">✓</span><span class="ic emoji">${e}</span><span>${esc(x)}</span>
        </div>`).join("")}</div>
      <div class="dd">
        <div class="do"><h3>${u.doTitle}</h3><ul>${c.do.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="dont"><h3>${u.dontTitle}</h3><ul>${c.dont.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>`;
  return `
  <section class="thero">
    <span class="ghost emoji" aria-hidden="true">${topic.emoji}</span>
    <div class="wrap">
      <div class="kick">${u.mission} ${idx+1} <span>/ ${TOPICS.length}</span></div>
      <h1 class="display">${esc(c.title)}</h1>
      <p>${esc(c.intro)}</p>
      <div class="meter"><div class="bar"><i id="meterBar"></i></div><b id="meterTxt"></b></div>
    </div>
  </section>
  <div class="stripe thin"></div>
  <div class="wrap">
    <div class="frame"><div class="player">${player(topic, u)}</div><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i></div>
    <div class="hint">${u.tapHint}</div>
    ${cards}
    <div class="stop"><span class="oct emoji">✋</span><span>${u.stop}</span></div>
    <div class="unlock ${hasBadge(topic) ? "done" : ""}" id="unlock">
      <div class="hex ${hasBadge(topic) ? "on" : ""}" id="badge"><span class="emoji">${topic.emoji}</span></div>
      <button class="btn" id="claim" ${hasBadge(topic) ? "hidden" : ""}>🏅 ${u.claim}</button>
      <div class="msg" id="umsg"></div>
    </div>
    <a class="nextm" href="${link(next.id)}"><span class="emoji">${next.emoji}</span><div><small>${u.next}</small><b>${esc(next[lang].title)}</b></div></a>
    <div class="by"><img src="img/avatar.webp" alt=""><div><small>${u.by}</small><b>${esc(CONFIG.ownerName[lang])}</b></div></div>
  </div>`;
}

function updateTopicState(){
  const u = UI[lang], n = countChecked(topic), total = itemsOf(topic);
  document.getElementById("meterBar").style.width = (n/total*100) + "%";
  document.getElementById("meterTxt").textContent = `${n}/${total}`;
  const claim = document.getElementById("claim"), msg = document.getElementById("umsg");
  if(hasBadge(topic)){ msg.textContent = u.unlocked; return; }
  claim.disabled = n < total;
  msg.textContent = n < total ? u.locked : "";
}

function toggle(e){
  const b = e.currentTarget, i = b.dataset.i, on = !checked(topic, i);
  store.set(`chk:${topic.id}:${i}`, on ? "1" : null);
  b.classList.toggle("on", on);
  b.setAttribute("aria-pressed", on);
  if(on && navigator.vibrate) navigator.vibrate(15);
  updateTopicState();
}

function claimBadge(){
  store.set("pledge:" + topic.id, "1");
  const box = document.getElementById("unlock");
  box.classList.add("done", "pop");
  document.getElementById("badge").classList.add("on");
  document.getElementById("claim").hidden = true;
  updateTopicState();
  if(navigator.vibrate) navigator.vibrate([40, 40, 80]);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const burst = document.createElement("div");
  burst.className = "burst";
  const emojis = ["⛑️","🦺","✅","👷","🛡️","💪","⭐","🏅"];
  for(let i = 0; i < 16; i++){
    const e = document.createElement("i"), a = Math.PI*2*i/16, d = 100 + Math.random()*70;
    e.textContent = emojis[i % emojis.length];
    e.style.setProperty("--x", Math.cos(a)*d + "px");
    e.style.setProperty("--y", Math.sin(a)*d + "px");
    e.style.setProperty("--r", (Math.random()*90-45) + "deg");
    burst.appendChild(e);
  }
  box.appendChild(burst);
  setTimeout(() => burst.remove(), 1100);
}

/* ---------- Shell ---------- */
function render(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = u.dir;
  document.body.className = lang;
  document.getElementById("top").classList.toggle("solid", !!topic);
  document.getElementById("siteName").textContent = u.site;
  document.getElementById("homeLink").href = "./?lang=" + lang;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  document.getElementById("app").innerHTML = topic ? renderTopic(u) : renderHome(u);
  if(topic){
    document.querySelectorAll(".ck").forEach(b => { b.onclick = toggle; b.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle({currentTarget: b}); } }; });
    document.getElementById("claim").onclick = claimBadge;
    updateTopicState();
  }
}

function setLang(l){
  lang = l;
  store.set("lang", l);
  document.getElementById("picker").hidden = true;
  const url = new URL(location.href); url.searchParams.set("lang", l);
  history.replaceState(null, "", url);
  render();
  scrollTo(0, 0);
}

function showPicker(){
  const t = topic || {ar:{title:UI.ar.heroTitle}, en:{title:UI.en.heroTitle}, ur:{title:UI.ur.heroTitle}};
  document.getElementById("pAr").textContent = t.ar.title;
  document.getElementById("pEn").textContent = t.en.title;
  document.getElementById("pUr").textContent = t.ur.title;
  document.getElementById("picker").hidden = false;
}

document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));

/* Start: ?lang= in the link wins, then the language chosen last time, else ask */
const start = params.get("lang") || store.get("lang");
if(UI[start]) setLang(start); else { lang = "ar"; render(); showPicker(); }
</script>
</body>
</html>
