<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-UIiVg22PC4ABTdJ22WSTrliOLGvfsog+qnGKL+MGxbk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">

<title>مختبر مكافحة الحريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen lab — 3D stage fills the view, an RTL control panel on the right, chapter rail along the bottom. Single dark "ember" world by design. */
:root{
  --bg:#0f0b0a; --stage:#140f0d; --panel:#1a1412; --line:#3a2c25; --fg:#f3ebe3; --mut:#b4a395;
  --ember:#ff7a1f; --sim:#38cbb7; --simbg:rgba(56,203,183,.07); --simline:rgba(56,203,183,.45); --flame:#ffb547; --alarm:#ff3d2e; --ok:#3fd17e; --water:#4fb4ff;
  --display:"Lalezar","Readex Pro",Tahoma,sans-serif; --body:"Readex Pro","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0;direction:rtl;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage panel" "rail rail"}
header{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--flame);letter-spacing:.3px;white-space:nowrap}
.brand span{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-size:12px;letter-spacing:2px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:4px 10px;direction:ltr;white-space:nowrap}
#stage{grid-area:stage;position:relative;background:radial-gradient(120% 90% at 50% 100%,#2a160c 0%,var(--stage) 55%);min-height:0;overflow:hidden;touch-action:none}
#stage canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none;direction:ltr}
#labels>.tag{left:0;top:0;direction:rtl}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(15,11,10,.78);border:1px solid var(--line);border-radius:30px;padding:8px 18px;font-size:13px;color:var(--mut);white-space:nowrap;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;top:16px;left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;transition:opacity .25s,transform .25s;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 20px;font-weight:500;font-size:16px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.good{border-color:var(--ok);color:#c9ffe0}#toast.bad{border-color:var(--alarm);color:#ffd2cc}
aside{grid-area:panel;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:22px 22px 28px;display:flex;flex-direction:column;gap:16px}
aside>*{flex-shrink:0}
.kick{font-size:12px;letter-spacing:1.5px;color:var(--ember);font-weight:600}
aside h2{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--mut);line-height:1.75;margin:0;max-width:60ch}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btns.one{grid-template-columns:1fr}
button{font-family:var(--body);font-size:14px;color:var(--fg);background:#241b17;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;text-align:right;line-height:1.35;transition:background .15s,border-color .15s}
button:hover{background:#2e221c;border-color:#5a4234}
button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
button.on{border-color:var(--ember);background:#3a2215}
button.off{opacity:.55;text-decoration:line-through}
button.primary{background:var(--ember);border-color:var(--ember);color:#1a0d05;font-weight:600;text-align:center}
button small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:8px;vertical-align:middle}
.out{background:#120d0b;border:1px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.8;min-height:58px}
.out b{color:var(--flame);font-weight:600}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.facts li{position:relative;padding-right:16px;line-height:1.6;color:var(--mut)}
.facts li::before{content:"";position:absolute;right:0;top:10px;width:6px;height:6px;border-radius:50%;background:var(--ember)}
.facts li b{color:var(--fg);font-weight:500}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:ltr}
.step{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.step i{display:block;font-style:normal;font-family:var(--display);font-size:30px;color:var(--mut);line-height:1}
.step span{display:block;font-size:12px;color:var(--mut);margin-top:4px;direction:rtl}
.step.now{border-color:var(--flame)}.step.now i{color:var(--flame)}
.step.done{border-color:var(--ok)}.step.done i{color:var(--ok)}
.meter{height:10px;border-radius:6px;background:#2a1f1a;overflow:hidden}
.meter div{height:100%;width:100%;background:linear-gradient(90deg,var(--flame),var(--alarm));transition:width .1s}
.row2{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;color:var(--mut)}
.cls{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:700;color:#fff;font-size:14px;direction:ltr}

/* simulation controls vs. course content */
aside .btns{position:relative;padding:30px 10px 10px;border:1px dashed var(--simline);border-radius:14px;background:var(--simbg)}
aside .btns::before{content:"▶ تحكّم بالمحاكاة";position:absolute;top:8px;right:12px;font-size:11px;letter-spacing:.5px;color:var(--sim);font-weight:600}
aside .quiz .btns{padding:0;border:0;background:none}aside .quiz .btns::before{display:none}
aside .btns button{border-color:#2f4a46;background:#18211f}
aside .btns button:hover{border-color:var(--sim);background:#1d2b28}
aside .btns button.on{border-color:var(--sim);background:#163a35;color:#dffaf5}
aside .btns button.primary{background:var(--sim);border-color:var(--sim);color:#06201c}
.out{border-right:3px solid var(--ember)}
.facts{background:#120d0b;border:1px solid var(--line);border-radius:12px;padding:30px 14px 12px;position:relative}
.facts::before{content:"◆ معلومة علمية";position:absolute;top:8px;right:14px;font-size:11px;color:var(--ember);font-weight:600}
nav{grid-area:rail;display:flex;gap:6px;overflow-x:auto;border-top:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:thin}
nav button{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:30px;white-space:nowrap}
nav button i{font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
nav button.on i{color:var(--flame)}
.tag{pointer-events:auto;font-family:var(--body);font-size:13px;font-weight:500;color:var(--fg);background:rgba(20,15,13,.86);border:1px solid var(--line);border-radius:20px;padding:5px 12px;white-space:nowrap;transform:translateY(-4px);cursor:default}
.tag.hot{cursor:pointer;border-color:var(--ember)}
.tag.hot:hover,.tag.sel{background:var(--ember);color:#1a0d05}
.tag.big{font-family:var(--display);font-size:22px;font-weight:400;padding:4px 14px}
.tag.ghost{opacity:.35}
/* extinguisher callouts + leader lines */
#leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#leaders path{fill:none;stroke:rgba(255,181,71,.9);stroke-width:1.5;stroke-linejoin:round;transition:stroke .2s}
#leaders .dot{fill:#ffb547;stroke:#140f0d;stroke-width:2}
#leaders .ring{fill:none;stroke:#ffb547;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
#leaders .back path{stroke:rgba(255,181,71,.4);stroke-dasharray:3 4}
#leaders .back .dot{fill:rgba(255,181,71,.45)}
#leaders .on path{stroke:#fff;stroke-width:2}
#leaders .on .dot{fill:#fff}
#leaders .on .ring{stroke:#fff;animation:ring 1.4s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}
.tag.co{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:4px 11px 4px 5px;font-size:13px;transition:opacity .3s,background .2s,color .2s;will-change:transform}
.tag.co.R{flex-direction:row-reverse;padding:4px 5px 4px 11px}
.tag.co i{font-style:normal;flex:none;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--ember);color:#1a0d05;font-size:11px;font-weight:700;direction:ltr}
.tag.co.sel i{background:#1a0d05;color:var(--flame)}
.tag.co.back{opacity:.5}
@media (max-width:560px){.tag.co{font-size:11.5px;gap:5px;padding:3px 8px 3px 4px}.tag.co.R{padding:3px 4px 3px 8px}.tag.co i{width:18px;height:18px;font-size:10px}}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pics figure{margin:0;background:#0b0807;border:1px solid var(--line);border-radius:10px;overflow:hidden}.pics img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.pics figcaption{font-size:12px;color:var(--mut);padding:6px 8px}
.quiz q{display:block;font-style:normal;font-weight:500;line-height:1.7;margin-bottom:10px;quotes:none}
.quiz button.right{border-color:var(--ok);background:#13301f}.quiz button.wrong{border-color:var(--alarm);background:#3a1512}
/* Phones & portrait tablets: app layout. The simulator stays pinned on top,
   the chapter rail sits under it, and only the lesson panel scrolls — so every
   control is reachable without losing sight of the simulation. */
@media (max-width:820px){
  html,body{height:100%;overflow:hidden}
  #app{height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto clamp(220px,44dvh,560px) auto minmax(0,1fr);grid-template-areas:"top" "stage" "rail" "panel"}
  header{padding-block:8px}
  aside{border-right:0;border-top:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;gap:12px;padding:14px max(14px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
  nav{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:8px;background:var(--bg);scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:7px 12px;font-size:13px}
  .brand span,.code{display:none}
  .brand h1{font-size:22px}
  aside h2{font-size:26px}
  .kick{font-size:11px}
  /* controls first, reading material after */
  aside .lead{order:2}aside .chips,aside .pics{order:3}aside .facts{order:4}
  aside .btns{padding-top:28px}
  button{padding:10px}
  .tag{font-size:12px;padding:4px 10px}
  .tag.big{font-size:16px;padding:3px 10px}
  #hint{bottom:8px;font-size:12px;padding:6px 14px}
  #toast{top:10px;font-size:14px;padding:9px 14px}
}
@media (min-width:600px) and (max-width:820px){
  #app{grid-template-rows:auto clamp(260px,50dvh,640px) auto minmax(0,1fr)}
  .tag.big{font-size:19px}
}
/* Phones held sideways: simulator on one side, controls on the other */
@media (orientation:landscape) and (max-height:540px){
  html,body{height:100%;overflow:hidden}
  #app{height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr) min(42vw,340px);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage panel" "rail rail"}
  header{padding-block:6px}
  .brand h1{font-size:20px}.brand span{display:none}
  aside{border-right:1px solid var(--line);overflow-y:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));gap:10px}
  aside h2{font-size:22px}
  aside .lead{order:2}aside .chips,aside .pics{order:3}aside .facts{order:4}
  nav{padding-block:6px;scrollbar-width:none}nav button{padding:6px 12px;font-size:13px}
  .tag.big{font-size:15px;padding:3px 9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.back{flex:none;font-size:13px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;white-space:nowrap}
.back:hover{border-color:var(--ember);color:var(--flame)}
@media (max-width:820px){.back{padding:5px 12px}}
@media (max-width:420px){.brand h1{font-size:22px}}

/* ---- English (left-to-right) ---- */
html[dir=ltr] body{direction:ltr}
html[dir=ltr] aside{border-right:0;border-left:1px solid var(--line)}
html[dir=ltr] button{text-align:left}
html[dir=ltr] .sw{margin-left:0;margin-right:8px}
html[dir=ltr] .facts li{padding-right:0;padding-left:16px}
html[dir=ltr] .facts li::before{right:auto;left:0}
html[dir=ltr] .out{border-right:1px solid var(--line);border-left:3px solid var(--ember)}
html[dir=ltr] aside .btns::before{right:auto;left:12px;content:"▶ Simulation controls"}
html[dir=ltr] .facts::before{right:auto;left:14px;content:"◆ Science fact"}
html[dir=ltr] #labels>.tag,html[dir=ltr] .step span{direction:ltr}
html[dir=ltr] .tag.co{flex-direction:row-reverse;padding:4px 5px 4px 11px}
html[dir=ltr] .tag.co.R{flex-direction:row;padding:4px 11px 4px 5px}
html[dir=ltr] .brand h1{letter-spacing:0}
@media (max-width:820px){html[dir=ltr] aside{border-left:0}}
@media (orientation:landscape) and (max-height:540px){html[dir=ltr] aside{border-left:1px solid var(--line)}}
/* ---- Urdu: Nastaliq for headings, Naskh for compact UI text ---- */
html[lang=ur]{--display:"Noto Nastaliq Urdu","Readex Pro",serif;--body:"Noto Naskh Arabic","Readex Pro",Tahoma,sans-serif}
html[lang=ur] aside .btns::before{content:"▶ سیمولیشن کنٹرول"}
html[lang=ur] .facts::before{content:"◆ سائنسی معلومات"}
html[lang=ur] .brand h1{font-size:22px;line-height:2;font-weight:700}
html[lang=ur] aside h2{font-size:28px;line-height:1.9;font-weight:700}
html[lang=ur] body{font-size:16px}
html[lang=ur] .tag.big{font-family:var(--body);font-size:19px;line-height:1.5;font-weight:700;padding:3px 14px}
html[lang=ur] .step i{font-family:"Lalezar","Readex Pro",sans-serif}
html[lang=ur] .lead,html[lang=ur] .out{line-height:1.9}
@media (max-width:820px){html[lang=ur] aside h2{font-size:23px}html[lang=ur] .brand h1{font-size:18px}html[lang=ur] .tag.big{font-size:15px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>مختبر مكافحة الحريق</h1><span>أساسيات مكافحة الحريق · تعلّم بالتجربة</span></div>
    <a class="back" href="../?t=ws&amp;w=fire&amp;lang=ar">رجوع للورشة ←</a>
  </header>
  <div id="stage"><div id="labels"></div><div id="hint">اسحب لتدوير المشهد</div><div id="toast"></div></div>
  <aside id="panel"></aside>
  <nav id="rail"></nav>
</div>
