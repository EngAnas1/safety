<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1430"/>
      <stop offset=".45" stop-color="#173258"/>
      <stop offset=".72" stop-color="#2B6A84"/>
      <stop offset=".86" stop-color="#E58A4E"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD59A" stop-opacity=".9"/><stop offset="1" stop-color="#FF9A4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3E63"/><stop offset="1" stop-color="#1A2547"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213F"/><stop offset="1" stop-color="#0B1430"/></linearGradient>
    <g id="tower">
      <path d="M-34 0 L-8 -300 L8 -300 L34 0" fill="none" stroke="#0B1430" stroke-width="6"/>
      <path d="M-30 -40 L26 -80 M30 -40 L-26 -80 M-24 -100 L20 -140 M24 -100 L-20 -140 M-18 -160 L14 -200 M18 -160 L-14 -200 M-13 -215 L10 -250 M13 -215 L-10 -250" stroke="#0B1430" stroke-width="3"/>
      <path d="M-70 -250 L70 -250 M-50 -285 L50 -285 M-70 -250 L-8 -300 M70 -250 L8 -300" stroke="#0B1430" stroke-width="5" fill="none"/>
      <path d="M-70 -250 L-70 -236 M70 -250 L70 -236 M-50 -285 L-50 -272 M50 -285 L50 -272" stroke="#0B1430" stroke-width="4"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="80" r="1.6" opacity=".8"/><circle cx="300" cy="150" r="1.2" opacity=".6"/><circle cx="460" cy="60" r="1.8" opacity=".9"/>
    <circle cx="640" cy="130" r="1.2" opacity=".5"/><circle cx="820" cy="50" r="1.5" opacity=".8"/><circle cx="980" cy="110" r="1.2" opacity=".6"/>
    <circle cx="1150" cy="70" r="1.8" opacity=".9"/><circle cx="1320" cy="140" r="1.3" opacity=".6"/><circle cx="1500" cy="60" r="1.6" opacity=".8"/>
    <circle cx="220" cy="240" r="1" opacity=".4"/><circle cx="760" cy="230" r="1" opacity=".4"/><circle cx="1420" cy="250" r="1" opacity=".4"/>
  </g>
  <!-- low sun glow -->
  <circle cx="560" cy="790" r="380" fill="url(#sun)"/>
  <!-- far hills -->
  <path d="M0 770 Q180 715 360 750 Q560 690 780 745 Q980 705 1180 752 Q1400 712 1600 745 L1600 900 L0 900 Z" fill="url(#hill1)"/>
  <!-- power lines -->
  <g fill="none" stroke="#0B1430" stroke-width="2.2" opacity=".9">
    <path d="M0 470 Q100 505 190 510 Q490 580 794 570 Q1110 600 1433 542 Q1520 548 1600 530"/>
    <path d="M0 480 Q170 520 330 510 Q620 590 906 570 Q1240 600 1567 542 L1600 538"/>
    <path d="M0 440 Q110 470 210 475 Q510 548 810 542 Q1130 560 1452 509 Q1530 512 1600 500"/>
  </g>
  <use href="#tower" x="260" y="760"/>
  <use href="#tower" x="850" y="770" transform="translate(850 770) scale(.8) translate(-850 -770)"/>
  <use href="#tower" x="1500" y="780" transform="translate(1500 780) scale(.95) translate(-1500 -780)"/>
  <!-- near ground -->
  <path d="M0 800 Q300 760 640 790 Q1000 820 1300 780 Q1460 765 1600 790 L1600 900 L0 900 Z" fill="url(#hill2)"/>
  <!-- cones -->
  <g>
    <path d="M1080 838 L1094 790 L1108 838 Z" fill="#FF7A2F"/><rect x="1072" y="836" width="44" height="8" rx="2" fill="#E2611E"/>
    <path d="M1088 810 L1100 810 L1102 818 L1086 818 Z" fill="#F4F6F8"/>
    <path d="M1150 846 L1162 806 L1174 846 Z" fill="#FF7A2F"/><rect x="1143" y="844" width="38" height="7" rx="2" fill="#E2611E"/>
    <path d="M1156 824 L1168 824 L1170 831 L1154 831 Z" fill="#F4F6F8"/>
  </g>
</svg>
