<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D49A74"/><stop offset="1" stop-color="#B9805C"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E9EEF4"/><stop offset="1" stop-color="#C3CDD9"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C5370"/><stop offset=".55" stop-color="#141C2B"/><stop offset="1" stop-color="#0A0F18"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2FF52"/><stop offset="1" stop-color="#B6E01E"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C5D2E2"/><stop offset="1" stop-color="#9FB1C8"/>
    </linearGradient>
  </defs>

  <!-- torso -->
  <path d="M58 420 Q66 330 130 304 Q200 282 270 304 Q334 330 342 420 Z" fill="url(#shirt)"/>
  <!-- vest -->
  <path d="M84 420 Q92 340 140 312 L178 300 L200 352 L222 300 L260 312 Q308 340 316 420 Z" fill="url(#vest)"/>
  <!-- reflective stripes -->
  <path d="M92 372 L186 372 L188 388 L90 388 Z" fill="#E4EAF1"/>
  <path d="M214 372 L310 372 L312 388 L212 388 Z" fill="#E4EAF1"/>
  <path d="M92 372 L186 372 L186 376 L92 376 Z" fill="#FFFFFF" opacity=".7"/>
  <path d="M214 372 L310 372 L310 376 L214 376 Z" fill="#FFFFFF" opacity=".7"/>
  <!-- vest edge + zip -->
  <path d="M200 352 L200 420" stroke="#8FB015" stroke-width="3"/>
  <!-- collar -->
  <path d="M168 292 L200 340 L184 300 Z" fill="#DCE5F0"/>
  <path d="M232 292 L200 340 L216 300 Z" fill="#DCE5F0"/>
  <!-- pocket + pen -->
  <rect x="236" y="330" width="34" height="26" rx="4" fill="#C7EE2A" stroke="#9CC21A" stroke-width="2"/>
  <rect x="246" y="318" width="5" height="20" rx="2" fill="#1E2A44"/>

  <!-- neck -->
  <path d="M176 250 L176 300 Q200 316 224 300 L224 250 Z" fill="#A9714F"/>

  <!-- ears -->
  <ellipse cx="136" cy="206" rx="11" ry="17" fill="#C48A65"/>
  <ellipse cx="264" cy="206" rx="11" ry="17" fill="#C48A65"/>

  <!-- head -->
  <path d="M138 178 Q138 112 200 112 Q262 112 262 178 L262 214 Q262 290 200 296 Q138 290 138 214 Z" fill="url(#skin)"/>

  <!-- beard -->
  <path d="M138 196 Q140 250 160 276 Q182 304 200 304 Q218 304 240 276 Q260 250 262 196 Q256 232 238 244 Q222 254 200 254 Q178 254 162 244 Q144 232 138 196 Z" fill="#2A1C16"/>
  <!-- mouth -->
  <path d="M176 254 Q200 280 224 254 Q200 262 176 254 Z" fill="#FFFFFF"/>
  <path d="M176 254 Q200 280 224 254" fill="none" stroke="#1A100C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- moustache -->
  <path d="M166 250 Q182 236 200 242 Q218 236 234 250 Q218 246 200 250 Q182 246 166 250 Z" fill="#2A1C16"/>
  <!-- nose -->
  <path d="M200 206 Q192 230 198 236 Q206 239 212 233" fill="none" stroke="#9A6343" stroke-width="3" stroke-linecap="round"/>

  <!-- brows -->
  <path d="M152 176 Q172 166 192 174" stroke="#1F1511" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M208 174 Q228 166 248 176" stroke="#1F1511" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- sunglasses -->
  <path d="M146 194 L134 190" stroke="#B08A46" stroke-width="3"/>
  <path d="M254 194 L266 190" stroke="#B08A46" stroke-width="3"/>
  <path d="M148 186 Q148 180 156 180 L190 180 Q196 180 196 188 Q196 214 174 216 Q150 216 148 200 Z" fill="url(#lens)" stroke="#C9A35A" stroke-width="2.5"/>
  <path d="M252 186 Q252 180 244 180 L210 180 Q204 180 204 188 Q204 214 226 216 Q250 216 252 200 Z" fill="url(#lens)" stroke="#C9A35A" stroke-width="2.5"/>
  <path d="M196 186 Q200 182 204 186" stroke="#C9A35A" stroke-width="3" fill="none"/>
  <path d="M156 186 L170 186 L160 200 Z" fill="#FFFFFF" opacity=".35"/>
  <path d="M212 186 L226 186 L216 200 Z" fill="#FFFFFF" opacity=".35"/>

  <!-- hair at temples -->
  <path d="M140 170 Q140 150 152 140 L150 172 Z" fill="#2A1C16"/>
  <path d="M260 170 Q260 150 248 140 L250 172 Z" fill="#2A1C16"/>

  <!-- hard hat -->
  <ellipse cx="200" cy="152" rx="70" ry="10" fill="#7B6252" opacity=".35"/>
  <path d="M124 150 Q124 70 200 64 Q276 70 276 150 Z" fill="url(#hat)"/>
  <path d="M188 66 Q200 62 212 66 L214 150 L186 150 Z" fill="#FFFFFF"/>
  <path d="M186 66 L186 150 M214 66 L214 150" stroke="#C3CDD9" stroke-width="2"/>
  <path d="M108 152 Q200 132 292 152 Q296 162 288 164 Q200 148 112 164 Q104 162 108 152 Z" fill="#E6ECF2"/>
  <path d="M112 164 Q200 148 288 164" stroke="#AEBACB" stroke-width="2" fill="none"/>
  <path d="M146 92 Q160 76 182 72" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity=".9"/>
</svg>
