<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">

<title>محاكاة اختبار التأهيل | المصدر والمستلم</title>
<meta name="description" content="محاكاة اختبار لجنة التأهيل لتصاريح العمل للمصدر والمستلم: نظري، واختيار التصاريح، وتعبئة تصريح العمل الأصلي، ودرجة نهائية مع مراجعة الأخطاء ونص المصدر. بالعربية والإنجليزية.">
<meta property="og:type" content="website">
<meta property="og:title" content="محاكاة اختبار لجنة التأهيل | المصدر والمستلم">
<meta property="og:description" content="اختبر نفسك كأنك أمام اللجنة: نظري، وتصاريح، وتعبئة التصريح الأصلي، ونتيجة مع المصادر.">
<meta property="og:url" content="https://enganas1.github.io/safety/exam/">
<meta property="og:image" content="https://enganas1.github.io/safety/img/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF1; --sheet:#FFFFFF; --ink:#0F1B2E; --ink2:#3B475B; --mute:#677286; --rule:#D2D8E1; --soft:#F3F5F8;
  --red:#D42A2F; --redBg:#FCEBEC; --yel:#F6D200; --yelBg:#FFF8D6; --blue:#1F6FD1; --blueBg:#E8F0FB; --ok:#0F7A57; --okBg:#E3F3EC;
  --font:"IBM Plex Sans Arabic",system-ui,sans-serif; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.65;min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1{font-weight:700;font-size:clamp(1.75rem,5vw,2.6rem);line-height:1.2;letter-spacing:-.01em}
h2,.sh{font-weight:700;font-size:1.2rem}
h3{font-weight:600;font-size:1.02rem}
.hint{color:var(--mute);font-size:.9rem;margin:2px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* header: dark band, mark = the three lock colours */
.bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.bwrap{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem;text-decoration:none}
.mark{display:grid;grid-template-columns:repeat(3,9px);gap:3px}
.mark i{height:20px;border-radius:3px;background:var(--red)}
.mark i:nth-child(2){background:var(--yel)}.mark i:nth-child(3){background:var(--blue)}
.lbtn{border:1.5px solid rgba(255,255,255,.4);border-radius:8px;padding:3px 14px;font-weight:600;font-size:.9rem}
.lbtn:hover{border-color:#fff}
.timer{font-weight:700;font-size:1.15rem;letter-spacing:.03em;direction:ltr;padding:2px 12px;border-radius:8px;background:rgba(255,255,255,.1)}
.timer.low{background:var(--red)}
.tbar{height:4px;background:rgba(255,255,255,.12)}
.tbar i{display:block;height:100%;width:0;background:var(--yel);transition:width .5s linear}

main{max-width:1100px;margin:0 auto;padding:22px 16px 64px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px}
.card+.card,.card+section,.prac>.card+.card{margin-top:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:8px;border:1.5px solid var(--ink);background:var(--sheet);font-weight:600;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#22324D}
.btn.big{width:100%;min-height:52px;font-size:1.05rem}
.btn.sm{min-height:36px;padding:3px 12px;font-size:.9rem}
.btn:disabled{opacity:.35;cursor:not-allowed}
.link{color:var(--blue);text-decoration:underline;font-size:.85rem}

/* intro */
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.cover{padding-top:6px}
.lead{margin-top:10px;color:var(--ink2);font-size:1.05rem;max-width:56ch}
.note{margin-top:14px;display:inline-block;border-inline-start:4px solid var(--yel);background:var(--yelBg);padding:6px 12px;border-radius:4px;font-weight:600;font-size:.92rem}
.parts{list-style:none;counter-reset:p;margin-top:22px;display:grid;gap:0;border-top:1px solid var(--rule)}
.parts li{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--rule);counter-increment:p}
.parts li::before{content:counter(p);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.parts b{font-weight:700}
.parts span{color:var(--mute);font-size:.92rem}
.rules{margin-top:12px;color:var(--ink2);font-weight:600;font-size:.92rem}

/* the entry permit — styled after the official form bands */
.entry{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;box-shadow:6px 6px 0 rgba(15,27,46,.12)}
.eh{display:flex;justify-content:space-between;gap:10px;background:var(--red);color:#fff;font-weight:700;padding:9px 16px}
.eh span:last-child{font-weight:500;opacity:.9}
.entry>.fld,.entry>.btn,.entry>.ef,.entry>.resume{margin-inline:16px}
.entry>.btn{width:calc(100% - 32px)}
.fld{display:block;border:0;margin-top:16px}
.fld>span,.fld legend{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.fld input{width:100%;border:0;border-bottom:1.5px dotted var(--ink2);background:transparent;padding:6px 2px;font-size:1.05rem}
.fld input:focus{outline:0;border-bottom:2px solid var(--blue)}
.fld input::placeholder{color:#9AA3B2;font-size:.9rem}
.radio{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-inline-start:6px solid var(--red);border-radius:4px;padding:9px 12px;margin-bottom:8px;cursor:pointer}
.radio.y{border-inline-start-color:var(--yel)}
.radio input{accent-color:var(--ink);width:18px;height:18px;flex:none}
.radio b{display:block;font-weight:600}
.radio small{display:block;color:var(--mute);font-size:.82rem}
.radio:has(input:checked){background:var(--soft);border-block-color:var(--ink);border-inline-end-color:var(--ink)}
.entry .btn.big{margin-top:16px}
.ef{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0 14px;color:var(--mute);font-size:.85rem}
.resume{margin-top:14px;background:var(--yelBg);border:1px solid #EEDD8A;border-radius:6px;padding:10px 12px}
.resume p{font-weight:600;margin-bottom:8px}
.studyb{grid-column:2;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px 16px;border:1.5px dashed var(--ink2);border-radius:6px;background:transparent;text-align:start}
.studyb:hover{background:var(--sheet)}
.studyb span{font-weight:600}.studyb small{color:var(--mute)}
.disc{grid-column:1/-1;color:var(--mute);font-size:.82rem;text-align:center;margin-top:20px}

/* steps */
.steps{display:flex;gap:6px;margin-bottom:16px}
.st{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;color:var(--mute)}
.st b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:.8rem}
.st.on{border-color:var(--ink);color:var(--ink)}
.st.on b{background:var(--ink);color:#fff}

/* theory */
.qwrap{display:grid;grid-template-columns:1fr 240px;gap:16px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.qn{font-weight:700}
.qn i{font-style:normal;color:var(--mute);font-weight:500}
.flagb{border:1px solid var(--rule);border-radius:999px;padding:2px 12px;font-size:.84rem;font-weight:600;color:var(--mute)}
.flagb.on{border-color:#C9A800;color:#7A6400;background:var(--yelBg)}
.qt{font-size:1.2rem;font-weight:600;line-height:1.6;margin-bottom:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--rule);border-radius:8px;padding:11px 13px;cursor:pointer;min-height:52px}
.opt:hover{border-color:#AEB7C5}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ol{flex:none;width:30px;height:30px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--ink2)}
.opt.on{border-color:var(--ink);background:var(--soft)}
.opt.on .ol{background:var(--ink);color:#fff}
.opt:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.qnav.end{justify-content:flex-end}
.pal{position:sticky;top:80px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border:1px solid var(--rule);border-radius:6px;font-size:.82rem;font-weight:600;color:var(--mute);position:relative}
.cell.ans{background:var(--ink);border-color:var(--ink);color:#fff}
.cell.cur{outline:2.5px solid var(--blue);outline-offset:1px}
.cell.flg::after{content:"";position:absolute;top:-4px;inset-inline-end:-4px;width:10px;height:10px;border-radius:50%;background:var(--yel);border:2px solid var(--sheet)}
.lockbox{display:flex;justify-content:center;margin:-4px 0 16px}
.lockimg{width:110px;height:auto}
.lockimg.sm{width:46px}
.lockbox.sm{justify-content:flex-start;margin:6px 0}

/* permits */
.pcase{border-top:1px solid var(--rule);padding:14px 0}
.pq{font-weight:600;margin-bottom:10px}
.pq b{display:inline-block;background:var(--ink);color:#fff;border-radius:4px;padding:0 8px;margin-inline-end:8px;font-size:.82rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;border:1.5px solid var(--rule);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:.88rem;font-weight:600;min-height:38px;display:flex;align-items:center}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}

/* practical */
.formhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ftag{font-weight:700;font-size:.85rem;border-radius:4px;padding:2px 10px;color:#fff;background:var(--red)}
.bd summary{cursor:pointer;font-weight:700;padding:4px 0}
.brief{margin-top:8px;display:grid;gap:0;border-top:1px solid var(--rule)}
.br{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:.93rem}
.br dt{color:var(--mute);font-weight:600}
.br dd b{font-weight:700}
.lk{display:inline-block;border-radius:4px;padding:0 8px;margin:2px;font-weight:700;font-size:.85rem;border:1.5px solid}
.lk.red{color:#9E1B1F;border-color:var(--red);background:var(--redBg)}
.lk.yellow{color:#6B5A00;border-color:#D4B500;background:var(--yelBg)}
.lk.blue{color:#174F95;border-color:var(--blue);background:var(--blueBg)}
.formcard{padding:14px}
.ftools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ftools .hint{margin:0;flex:1;min-width:220px}
.zm{display:flex;align-items:center;gap:6px}
.cnt{font-size:.85rem;color:var(--mute);margin-inline-end:6px}
.pscroll{overflow:auto;border:1px solid var(--rule);border-radius:6px;background:#fff;max-height:80vh;-webkit-overflow-scrolling:touch}
.pf{position:relative;container-type:inline-size;min-width:100%}
.pf img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.fx{position:absolute;display:flex;align-items:center;overflow:hidden;border-radius:2px}
.ft{background:rgba(31,111,209,.07);outline:1px dashed rgba(31,111,209,.45);outline-offset:-1px;padding:0 .3cqw;font-size:1.55cqw;line-height:1;color:#0C3E86;font-weight:600;white-space:nowrap}
.ft.on{background:rgba(255,255,255,.75);outline-color:transparent}
.ft span{overflow:hidden;text-overflow:ellipsis;width:100%;text-align:start}
.fc{background:rgba(31,111,209,.12);outline:1px solid rgba(31,111,209,.55);justify-content:center}
.fc.on{background:transparent;outline-color:transparent}
.fc.on::after{content:"✓";color:#0C3E86;font-weight:700;font-size:2.2cqw;line-height:1}
.fs{background:rgba(31,111,209,.06);outline:1px dashed rgba(31,111,209,.45);outline-offset:-1px;padding:0 1cqw}
.fs.on{background:transparent;outline-color:transparent}
.fs span{font-family:"Aref Ruqaa",serif;font-size:1.9cqw;color:#0C3E86;line-height:1;white-space:nowrap}
.fx.cur{outline:2px solid var(--red);background:rgba(212,42,47,.12)}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(15,27,46,.35);display:flex;align-items:flex-end;justify-content:center}
.sbox{width:min(560px,100%);background:var(--sheet);border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:5px solid var(--red)}
.sbox label{display:block;font-weight:700;margin-bottom:8px}
.sbox input{width:100%;border:1.5px solid var(--ink2);border-radius:8px;padding:10px 12px;font-size:1.05rem;margin-bottom:12px}
.sbox input:focus{outline:0;border-color:var(--blue)}
.sbox .grow{flex:1}
.spb{margin-top:14px}
.sphead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.splist{list-style:none;display:grid;gap:6px}
.sp{width:100%;display:flex;align-items:center;gap:12px;text-align:start;border:1.5px dashed #AEB7C5;border-radius:8px;padding:9px 12px;background:var(--soft);min-height:48px}
.sp .spn{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px dashed #AEB7C5;display:grid;place-items:center;font-weight:700}
.sp.on{border-style:solid;border-color:var(--ink);background:var(--sheet)}
.sp.on .spn{background:var(--ink);border:0;color:#fff}

/* modal */
.modal{position:fixed;inset:0;z-index:70;background:rgba(15,27,46,.5);display:grid;place-items:center;padding:16px}
.mbox{background:var(--sheet);border-radius:10px;padding:22px;max-width:420px;width:100%;font-weight:600}
.mbox .row{margin-top:14px;justify-content:flex-end}
.warn{margin-top:10px;background:var(--yelBg);border-inline-start:4px solid var(--yel);border-radius:4px;padding:6px 12px;font-weight:600}

/* result */
.sheetc{border-top:8px solid var(--ok)}
.sheetc.fail{border-top-color:var(--red)}
.shead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.meta{color:var(--ink2);margin-top:6px;font-size:.93rem}
.stamp{flex:none;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;border:4px double var(--ok);color:var(--ok);transform:rotate(-10deg);font-weight:700;font-size:1.15rem;text-align:center;padding:10px;line-height:1.1}
.fail .stamp{border-color:var(--red);color:var(--red)}
.big{display:flex;align-items:baseline;gap:14px;margin:10px 0 14px;flex-wrap:wrap}
.big b{font-size:3.6rem;font-weight:700;line-height:1}
.big span{color:var(--mute);font-weight:600}
.sb{margin:9px 0}
.sbl{display:flex;justify-content:space-between;font-weight:600;font-size:.93rem}
.sbt{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:4px;border:1px solid var(--rule)}
.sbt i{display:block;height:100%;background:var(--ink)}
.acts{margin-top:16px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{padding:4px 12px;font-weight:600;font-size:.86rem}
.seg button.on{background:var(--ink);color:#fff}
.rh{margin:20px 0 8px}
.rvl,.slist{list-style:none;display:grid;gap:10px}
.rv{display:flex;gap:12px;border:1px solid var(--rule);border-radius:8px;padding:12px 14px;border-inline-start:5px solid var(--ok)}
.rv.bad{border-inline-start-color:var(--red)}
.rk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--ok);font-size:.85rem}
.rv.bad .rk{background:var(--red)}
.rb{min-width:0;flex:1}
.rq{font-weight:600}
.ry,.rc{font-size:.93rem;margin-top:4px;color:var(--ink2)}
.rc b{color:var(--ok)}
.ry b{color:var(--red)}
.mini{padding-inline-start:22px;margin-top:2px}
.srcs{margin-top:10px;display:grid;gap:8px}
.src{background:var(--soft);border-radius:6px;padding:8px 12px;border-inline-start:3px solid var(--ink2)}
.src figcaption{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--mute)}
.src figcaption b{color:var(--ink2);font-weight:600}
.src blockquote{margin-top:4px;font-size:.9rem;line-height:1.7;color:var(--ink)}

/* study */
.sthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
.filters input,.filters select{flex:1;min-width:200px;border:1.5px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--sheet)}
.sitem{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px}

@media (max-width:860px){
  .intro{grid-template-columns:1fr}
  .studyb{grid-column:1}
  .qwrap{grid-template-columns:1fr}
  .pal{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:540px){
  body{font-size:16px}
  main{padding:14px 12px 56px}
  .card{padding:14px}
  .brand span:last-child{font-size:.84rem}
  .st{flex-direction:column;gap:2px;font-size:.82rem;padding:6px 4px}
  .grid{grid-template-columns:repeat(6,1fr)}
  .br{grid-template-columns:1fr;gap:0}
  .stamp{width:92px;height:92px;font-size:.95rem}
  .big b{font-size:2.8rem}
  .qnav .btn{flex:1}
  .pscroll{max-height:70vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body,html{background:#fff}
  .bar,.acts,.seg,.disc{display:none!important}
  .card{border:0;break-inside:avoid-page}
}
</style>
</head>
