<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1430">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Safety Awareness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero-m.webp">
<script src="content.js?v=202611012055"></script>
<script src="quiz.js?v=202611012055"></script>
<style>
/* =====================================================================
   الألوان — مأخوذة من المقطع والرسمة. غيّرها هنا فقط
   ===================================================================== */
:root{
  --night:#0B1430;     /* أعمق خلفية */
  --dusk:#14254F;      /* البطاقات */
  --sky:#254563;       /* سماء الغروب */
  --royal:#0A2E89;
  --teal:#05CEB3;
  --lime:#D7FF3C;      /* لون السترة العاكسة — لون التمييز */
  --glow:#FF9A4D;      /* وهج الأفق */
  --red:#FF4D57;
  --text:#EAF2FF;
  --muted:#9DB1D6;
  --line:rgba(157,177,214,.18);
  --silver:#C9D2DC;
  --display:"Zain",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--night);color:var(--text);font-family:"Zain",system-ui,sans-serif;font-size:19px;line-height:1.6;min-height:100vh;overflow-x:hidden}
body.ur{font-family:"Noto Nastaliq Urdu","Zain",serif;font-size:15.5px;line-height:2.35}
body.ur{--display:"Noto Nastaliq Urdu",serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
img{display:block;max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;font-weight:400}
.display{font-family:var(--display);font-weight:900;letter-spacing:-.01em}
body.ur .display{font-weight:700;letter-spacing:0}

/* ---------- Signature: hi-vis reflective stripe ---------- */
.stripe{height:12px;background:linear-gradient(var(--lime) 0 32%,var(--silver) 32% 68%,var(--lime) 68%);box-shadow:0 0 24px rgba(215,255,60,.25)}
.stripe.thin{height:7px}

/* ---------- Top bar ---------- */
.top{position:absolute;top:0;inset-inline:0;z-index:10}
.top.solid{position:sticky;background:rgba(11,20,48,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.05rem}
body.ur .logo{font-weight:700;font-size:.95rem}
.logo .m{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--lime);font-size:19px;box-shadow:0 0 18px rgba(215,255,60,.35)}
.lang{display:flex;align-items:center;gap:8px;background:rgba(11,20,48,.55);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600;backdrop-filter:blur(8px)}
.lang:hover{border-color:var(--lime)}
body.ur .lang{padding:0 14px}

/* ---------- Home hero: 3D illustration, headline in the open sky ---------- */
.hero{position:relative;overflow:hidden;background:var(--night);min-height:min(92vh,800px);display:flex;align-items:center}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:20%;background:linear-gradient(transparent,var(--night));pointer-events:none}
.hero .in{position:relative;z-index:1;width:100%;max-width:1240px;margin:0 auto;padding:100px 24px 60px;display:flex;justify-content:flex-end;direction:ltr}
.hero .copy{width:min(46%,560px)}
.hero .mimg{display:none}
.hero .tag{display:inline-block;margin-bottom:14px;background:linear-gradient(90deg,#039DB0,#1A7FE8);color:#fff;font-weight:800;font-size:.9rem;border-radius:10px;padding:3px 14px}
body.ur .hero .tag{font-weight:700;padding:0 14px}
.hero .meter{margin-top:22px;max-width:420px}
.hero .chip{text-decoration:none}
.hero h1{font-size:clamp(2.4rem,5.6vw,5rem);line-height:1.05;text-wrap:balance}
body.ur .hero h1{line-height:1.7;font-size:clamp(1.9rem,4vw,3.4rem)}
.hero h1 .w{display:inline-block;animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both}
.hero p{margin-top:16px;color:#C9D6EE;font-size:clamp(1rem,1.4vw,1.2rem);max-width:34ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--lime);color:var(--night);font-family:var(--display);font-weight:800;padding:13px 22px;border-radius:14px;box-shadow:0 10px 30px -10px rgba(215,255,60,.55);transition:transform .12s}
body.ur .btn{font-weight:700;padding:6px 22px}
.btn img{width:26px;height:26px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(11,20,48,.55);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600;backdrop-filter:blur(6px)}
.chip b{color:var(--lime)}
@keyframes rise{from{opacity:0;transform:translateY(40%)}to{opacity:1;transform:none}}
@media all{
  .hero{min-height:0;background:var(--night);display:block}
  .hero .in{display:block;padding:0}
  .hero .mimg{display:block;width:100%;aspect-ratio:720/1050;max-height:62vh;object-fit:cover;object-position:30% 20%;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
  .hero .copy{width:auto;padding:0 18px 28px;margin-top:-40px;position:relative}
  .hero h1{font-size:clamp(2.4rem,11vw,3.4rem)}
  body.ur .hero h1{font-size:clamp(1.9rem,8vw,2.6rem)}
}
}

/* ---------- Section heads ---------- */
.sec{padding:42px 0 8px}
.sec h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.2;margin-bottom:18px}
body.ur .sec h2{font-weight:700;line-height:1.9}

/* ---------- Tip of the day ---------- */
.tip{position:relative;display:flex;gap:18px;align-items:center;background:linear-gradient(100deg,rgba(255,154,77,.18),var(--dusk) 55%);border:1px solid var(--line);border-radius:22px;padding:20px 22px;overflow:hidden}
.tip .emoji{font-size:44px;flex-shrink:0}
.tip small{display:block;color:var(--glow);font-weight:700;font-size:.85rem}
.tip p{font-size:1.1rem;font-weight:600;line-height:1.55}
body.ur .tip p{line-height:2.2}

/* ---------- Mission cards ---------- */
.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.missions{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.missions{grid-template-columns:1fr}}
.mcard{position:relative;display:flex;flex-direction:column;gap:12px;min-height:220px;padding:20px;border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(37,69,99,.95),var(--dusk) 60%);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.mcard:hover{transform:translateY(-4px);border-color:rgba(215,255,60,.6)}
.mcard .no{font-family:"Zain",sans-serif;font-weight:900;font-size:4.2rem;line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(157,177,214,.35)}
.mcard .big{position:absolute;inset-inline-end:8px;top:4px;width:110px;height:110px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4));transition:transform .2s}
.mcard:hover .big{transform:rotate(-6deg) scale(1.06)}
.mcard h3{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.25;margin-top:auto}
body.ur .mcard h3{font-weight:700;line-height:1.9;font-size:1.15rem}
.mcard .bar{height:6px;border-radius:6px;background:rgba(157,177,214,.18);overflow:hidden}
.mcard .bar i{display:block;height:100%;background:var(--lime);border-radius:6px}
.mcard .st{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted)}
.mcard.done{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime),0 18px 40px -20px rgba(215,255,60,.5)}
.mcard.done .st b{color:var(--lime)}
.mcard.lead{grid-column:span 2;background:linear-gradient(120deg,rgba(5,206,179,.25),transparent 55%),radial-gradient(120% 90% at 100% 0%,var(--royal),var(--dusk) 65%)}
@media (max-width:520px){.mcard.lead{grid-column:auto}.mcard.lead .big{width:100px;height:100px}.mcard{min-height:200px}.mcard h3{padding-top:70px}}
.mcard.lead .big{width:150px;height:150px}

/* ---------- Badges ---------- */
.badges{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hex{width:74px;height:84px;display:grid;place-items:center;font-size:32px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(157,177,214,.14);position:relative}
.hex.on{background:var(--lime);box-shadow:none}
.hex img{width:62%;height:62%}
.hex:not(.on) img{filter:grayscale(1) opacity(.35)}
.hex:not(.on)::after{content:"🔒";position:absolute;font-size:16px;bottom:14px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.prog{margin-inline-start:auto;text-align:end}
.prog b{display:block;font-family:"Zain",sans-serif;font-weight:900;font-size:2.2rem;line-height:1;color:var(--lime)}
.prog span{color:var(--muted);font-size:.9rem}
@media (max-width:560px){.prog{margin-inline-start:0;width:100%;text-align:start}}
.hero-msg{margin-top:12px;color:var(--lime);font-family:var(--display);font-weight:800}

/* ---------- Creator ---------- */
.creator{position:relative;display:grid;grid-template-columns:minmax(0,.9fr) 1.1fr;gap:0;align-items:stretch;border-radius:28px;overflow:hidden;background:linear-gradient(120deg,var(--dusk),var(--night));border:1px solid var(--line);margin-top:10px}
@media (max-width:700px){.creator{grid-template-columns:1fr}}
.creator .cart{min-height:360px}
.creator .cart img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.creator .txt{padding:34px 30px;display:flex;flex-direction:column;justify-content:center}
.creator small{color:var(--teal);font-weight:700}
.creator h3{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:6px 0 14px}
body.ur .creator h3{line-height:1.8}
.creator p{color:var(--muted);font-size:1.1rem;max-width:30ch}
.creator .stripe{margin-top:22px;width:140px;border-radius:3px}

footer{padding:30px 0 44px;color:var(--muted);font-size:.85rem;text-align:center}

/* ---------- Topic page ---------- */
.thero{position:relative;padding:34px 0 28px;overflow:hidden;background:radial-gradient(90% 120% at 85% 0%,var(--sky),var(--night) 70%)}
.thero::before{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(255,154,77,.10))}
.thero .ghost{position:absolute;inset-inline-end:max(2vw,calc((100vw - 1120px)/2));top:24px;width:min(34vw,300px);filter:drop-shadow(0 20px 30px rgba(0,0,0,.4));pointer-events:none}
@media (max-width:760px){.thero .ghost{position:relative;inset:auto;display:block;width:150px;margin:0 auto 6px}}
.thero .wrap{position:relative}
.kick{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:.9rem;color:var(--lime)}
.kick span{color:var(--muted);font-weight:500}
.thero h1{font-size:clamp(2.3rem,8vw,4.6rem);line-height:1.05;margin:10px 0 12px;max-width:16ch}
body.ur .thero h1{line-height:1.7;font-size:clamp(1.9rem,6vw,3.4rem)}
.thero p{color:var(--muted);font-size:1.12rem;max-width:44ch}
.meter{display:flex;align-items:center;gap:14px;margin-top:22px;max-width:520px}
.meter .bar{flex:1;height:10px;border-radius:10px;background:rgba(157,177,214,.18);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--lime));border-radius:10px;transition:width .4s}
.meter b{font-family:"Zain",sans-serif;font-weight:900;font-size:1.2rem;min-width:3.4em;text-align:end}

.frame{position:relative;margin:26px 0 8px;border-radius:18px;padding:10px;background:rgba(157,177,214,.06)}
.frame .player{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#050A1C}
.frame video,.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050A1C}
.frame .empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);text-align:center;background:radial-gradient(circle,var(--dusk),#050A1C)}
.frame .empty .emoji{font-size:44px}
.frame i.c{position:absolute;width:30px;height:30px;border:4px solid var(--lime)}
.frame i.c1{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:16px}
.frame i.c2{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:16px}
.frame i.c3{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:16px}
.frame i.c4{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:16px}


.cards{display:grid;gap:12px}
@media (min-width:860px){.cards.rules{grid-template-columns:1fr 1fr}}
.ck{position:relative;display:block;width:100%;text-align:start;background:var(--dusk);border:1.5px solid var(--line);border-radius:20px;padding:18px 18px 18px;transition:border-color .15s,background .15s}
.ck header{display:flex;align-items:center;gap:14px}
.ck .n{font-family:"Zain",sans-serif;font-weight:900;font-size:2.6rem;line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--teal);min-width:1.3em}
.ck .ic{font-size:30px}
.ck h3{font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.3}
body.ur .ck h3{font-weight:700;line-height:1.9;font-size:1.05rem}
.ck ul{list-style:none;display:grid;gap:6px;margin-top:12px}
.ck li{display:flex;gap:10px;align-items:flex-start;font-size:.97rem}
.ck li::before{flex-shrink:0;width:20px;height:20px;margin-top:.35em;border-radius:6px;display:grid;place-items:center;font-size:.7rem;font-weight:900}
body.ur .ck li::before{margin-top:.6em}
.ck li.yes::before{content:"✓";background:var(--teal);color:var(--night)}
.ck li.no::before{content:"✕";background:var(--red);color:#fff}
.ck li.info::before{content:"";width:8px;height:8px;margin:.75em 6px 0;background:var(--muted);border-radius:2px}
body.ur .ck li.info::before{margin-top:1.15em}
.ck li.no{color:#FFC4C8}
.ck.pt{display:flex;gap:14px;align-items:center}
.ck.pt .ic{font-size:30px}

.dd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:560px){.dd{grid-template-columns:1fr}}
.dd > div{border-radius:20px;padding:16px 18px;background:var(--dusk);border-top:5px solid}
.dd .do{border-color:var(--teal)} .dd .dont{border-color:var(--red)}
.dd h3{font-family:var(--display);font-weight:800;margin-bottom:8px}
.dd ul{list-style:none;display:grid;gap:6px}
.dd li{display:flex;gap:8px}
.dd .do li::before{content:"✅"} .dd .dont li::before{content:"❌"}

.stop{display:flex;gap:16px;align-items:center;margin-top:24px;padding:18px 20px;border-radius:20px;background:linear-gradient(100deg,rgba(255,77,87,.22),var(--dusk) 70%);border:1px solid rgba(255,77,87,.45);font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.4}
body.ur .stop{font-weight:700;line-height:2}
.oct{width:54px;height:54px;flex-shrink:0;display:grid;place-items:center;background:var(--red);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);font-size:24px}


.nextm{display:flex;align-items:center;gap:16px;margin-top:16px;padding:18px 20px;border-radius:22px;background:linear-gradient(120deg,var(--royal),var(--dusk));border:1px solid var(--line);transition:transform .15s}
.nextm:hover{transform:translateY(-3px)}
.nextm img{width:64px;height:64px}
.nextm small{color:var(--lime);font-weight:700;display:block}
.nextm b{font-family:var(--display);font-weight:800;font-size:1.3rem}
body.ur .nextm b{font-weight:700}

.by{display:flex;align-items:center;gap:14px;justify-content:center;padding:34px 0 46px}
.by .av{width:60px;height:60px;border-radius:50%;border:2px solid var(--lime);overflow:hidden;background:var(--sky);flex-shrink:0}
.by .av img{width:100%;height:100%;object-fit:cover}
.by small{display:block;color:var(--muted);font-size:.8rem}
.by b{font-family:var(--display);font-weight:800;font-size:1.15rem}
body.ur .by b{font-weight:700}

/* ---------- Quiz ---------- */
.h2{font-family:var(--display);font-weight:900;font-size:1.6rem;margin:34px 0 14px}
.quiz{position:relative;scroll-margin-top:80px;margin:22px 0 8px;padding:22px;border-radius:26px;background:radial-gradient(90% 120% at 100% 0%,rgba(5,206,179,.16),var(--dusk) 60%);border:1.5px solid rgba(215,255,60,.35);box-shadow:0 20px 50px -30px rgba(215,255,60,.5)}
.quiz.won{border-color:var(--lime);background:radial-gradient(90% 120% at 50% 0%,rgba(215,255,60,.20),var(--dusk) 65%)}
.qhead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.qhead .hex{width:78px;height:88px;flex-shrink:0}
.qhead h2{font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:1.2}
.qhead p{color:var(--muted)}
body.ur .qhead h2{font-weight:700;line-height:1.9}
.qgo{width:100%;justify-content:center;font-size:1.15rem}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-size:.95rem}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:8px;border-radius:8px;background:rgba(157,177,214,.22)}
.dots i.now{background:var(--teal);box-shadow:0 0 10px var(--teal)}
.dots i.ok{background:var(--lime)} .dots i.bad{background:var(--red)}
.qq{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,4.4vw,1.75rem);line-height:1.35;margin:16px 0 14px;animation:qin .35s ease both}
body.ur .qq{font-weight:700;line-height:2}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:14px 16px;border-radius:16px;background:rgba(11,20,48,.55);border:1.5px solid var(--line);font-size:1.08rem;font-weight:700;line-height:1.4;transition:transform .12s,border-color .15s,background .15s;animation:qin .35s ease both}
.opt:nth-child(2){animation-delay:.06s} .opt:nth-child(3){animation-delay:.12s}
body.ur .opt{font-weight:400;padding:8px 16px;line-height:2}
.opt:hover:not(:disabled){border-color:var(--teal);transform:translateY(-2px)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .key{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:rgba(157,177,214,.15);font-weight:900}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--lime);background:rgba(215,255,60,.14);animation:pulse .5s ease}
.opt.right .key{background:var(--lime);color:var(--night)}
.opt.wrong{border-color:var(--red);background:rgba(255,77,87,.14);animation:shake .45s ease}
.opt.wrong .key{background:var(--red);color:#fff}
.fb .fbin{margin-top:14px;padding:14px 16px;border-radius:16px;animation:qin .3s ease both}
.fb .ok{background:rgba(215,255,60,.10);border-inline-start:5px solid var(--lime)}
.fb .bad{background:rgba(255,77,87,.10);border-inline-start:5px solid var(--red)}
.fb b{font-family:var(--display);font-size:1.15rem}
.fb p{color:#C9D6EE;margin-top:4px}
.fb .btn{margin-top:14px;width:100%;justify-content:center}
.quiz.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.quiz.result h3{font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1.3}
body.ur .quiz.result h3{font-weight:700;line-height:2}
.quiz.result .sc{color:var(--muted)} .quiz.result .sc b{color:var(--text)}
.ring{width:150px;height:150px}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:rgba(157,177,214,.2)}
.ring .fg{stroke:var(--teal);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring text{fill:var(--text);font:900 30px "Zain",sans-serif}
.medal{perspective:600px;margin:6px 0}
.medal .hex{width:140px;height:158px;animation:flip 1.1s cubic-bezier(.2,.9,.3,1.1) both;box-shadow:0 0 60px rgba(215,255,60,.6)}
.medal::after{content:"";display:block;width:180px;height:24px;margin:-6px auto 0;border-radius:50%;background:radial-gradient(rgba(215,255,60,.45),transparent 70%)}
.spark{position:fixed;z-index:60;color:var(--lime);font-style:normal;font-size:18px;pointer-events:none;animation:spark .7s ease-out forwards}
.confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
@keyframes qin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes flip{0%{transform:rotateY(-540deg) scale(.3);opacity:0}70%{transform:rotateY(20deg) scale(1.08);opacity:1}100%{transform:rotateY(0) scale(1)}}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
.meter .ml{color:var(--muted);font-weight:700;font-size:.9rem;white-space:nowrap}
.refs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;color:var(--muted);font-size:.9rem}
.refs small{font-weight:700;color:var(--teal);font-size:.9rem}
.refs span{border:1px solid var(--line);border-radius:999px;padding:2px 12px}

/* ---------- Language picker ---------- */
#picker{position:fixed;inset:0;z-index:40;background:var(--night);overflow:auto}
#picker .pin{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#picker .art{position:relative}
#picker .art{-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
#picker .art img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 20%}
#picker .pc{padding:0 18px 30px;margin-top:-30px;position:relative}
#picker .t-ar{font-family:"Zain",sans-serif;font-weight:900;font-size:2rem;line-height:1.15}
#picker .t-en{font-family:"Zain",sans-serif;font-weight:700;color:var(--lime);margin-top:6px;text-align:right}
#picker .t-ur{font-family:"Noto Nastaliq Urdu",serif;color:var(--muted);line-height:2.3}
#picker .choose{display:grid;gap:10px;margin-top:18px}
#picker .choose button{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-radius:16px;background:var(--dusk);border:1.5px solid var(--line);font-family:"Zain",sans-serif;font-size:1.3rem;font-weight:800;transition:border-color .12s,transform .12s}
#picker .choose button:hover{border-color:var(--lime)}
#picker .choose button:active{transform:scale(.98)}
#picker .choose button small{font-family:"Zain",sans-serif;font-size:.85rem;font-weight:500;color:var(--muted)}
#picker .choose .ur{font-family:"Noto Nastaliq Urdu",serif;font-weight:700;padding-block:8px}
@media (min-width:761px){#picker .pin{justify-content:center}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.burst{display:none}}
/* Same layout on every screen: the phone design, centered on wide screens */
html{background:#050A1C}
body{position:relative;max-width:480px;margin:0 auto;box-shadow:0 0 0 1px var(--line),0 0 80px rgba(0,0,0,.6)}
.creator{grid-template-columns:1fr}
.qicon{width:72px;height:72px;flex-shrink:0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.trophy{font-size:96px;animation:flip 1.1s cubic-bezier(.2,.9,.3,1.1) both;filter:drop-shadow(0 0 30px rgba(215,255,60,.55))}
</style>
</head>
<body>

<div id="picker" hidden>
  <div class="pin">
    <div class="art"><img src="img/me.webp" alt=""></div>
    <div class="pc">
      <div class="t-ar" id="pAr"></div>
      <div class="t-en" id="pEn" dir="ltr"></div>
      <div class="t-ur" id="pUr"></div>
      <div class="choose">
        <button data-lang="ar"><span>العربية</span><small>اختر لغتك</small></button>
        <button data-lang="en"><span>English</span><small>Choose language</small></button>
        <button data-lang="ur" class="ur"><span>اردو</span><small>زبان منتخب کریں</small></button>
      </div>
    </div>
  </div>
</div>

<header class="top" id="top">
  <div class="wrap">
    <a class="logo" id="homeLink" href="./"><span class="m emoji">⛑️</span><span id="siteName"></span></a>
    <button class="lang" id="langBtn"><span class="emoji">🌐</span><span id="langLbl"></span></button>
  </div>
</header>

<main id="app"></main>

<script>
const params = new URLSearchParams(location.search);
/* The site has one topic: Life Saving Rules. Old links (?t=risk, ?t=ppe…) land here too. */
const topic = TOPICS[0];
if(params.has("t")){ params.delete("t"); history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params : "")); }
let lang = null;

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k,v) }catch(e){} }
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link = id => `?t=${id}&lang=${lang}`;
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const art = t => `img/t-${t.id}.webp`;

/* Quiz progress: best score per topic; a perfect score earns the badge */
const QN = t => Math.min(QUIZ_SIZE, (QUIZ[t.id] || []).length);
const bestScore = t => +(store.get("best:" + t.id) || 0);
const refLabel = r => typeof r === "string" ? r : r[lang];

function ytId(url){
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function player(t, u){
  const src = (CONFIG.videos[t.id]?.[lang] || "").trim();
  const poster = CONFIG.posters?.[t.id]?.[lang] || "";
  if(!src) return `<div class="empty"><span class="emoji">🎬</span><span>${u.noVideo}</span></div>`;
  const y = ytId(src);
  if(y) return `<iframe src="https://www.youtube-nocookie.com/embed/${y}?rel=0&playsinline=1" title="video" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  return `<video src="${esc(src)}" ${poster ? `poster="${esc(poster)}"` : ""} controls playsinline preload="metadata"></video>`;
}

/* ---------- Topic ---------- */
function renderTopic(u){
  const c = topic[lang];
  document.title = c.title;
  const content = topic.rules
    ? `<div class="cards rules">${topic.rules.map((r, i) => `
        <article class="ck">
          <header><span class="n">${i+1}</span><span class="ic emoji">${r.emoji}</span><h3>${esc(r[lang].t)}</h3></header>
          <ul>${r[lang].items.map(([ok, x]) => `<li class="${ok===true?"yes":ok===false?"no":"info"}">${esc(x)}</li>`).join("")}</ul>
        </article>`).join("")}</div>`
    : `<div class="cards">${c.points.map(([e, x]) => `
        <div class="ck pt"><span class="ic emoji">${e}</span><span>${esc(x)}</span></div>`).join("")}</div>
      <div class="dd">
        <div class="do"><h3>${u.doTitle}</h3><ul>${c.do.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="dont"><h3>${u.dontTitle}</h3><ul>${c.dont.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>`;
  const refs = (REFS[topic.id] || []).map(r => `<span>${esc(refLabel(r))}</span>`).join("");
  const words = c.title.split(" ").map((w, i) => `<span class="w" style="animation-delay:${.15 + i*.12}s">${esc(w)}</span>`).join(" ");
  return `
  <section class="hero">
    <div class="in">
      <img class="mimg" src="img/hero-m.webp" alt="${esc(CONFIG.ownerName[lang])}">
      <div class="copy" dir="${u.dir}">
        ${CONFIG.siteTag?.[lang] ? `<span class="tag">${esc(CONFIG.siteTag[lang])}</span>` : ""}
        <h1 class="display">${words}</h1>
        <p>${esc(c.intro)}</p>
        <div class="cta">
          <a class="btn" href="#watch">▶ ${u.watch}</a>
          <a class="chip" href="#quiz">🎯 ${u.quizTitle}</a>
        </div>
        <div class="meter"><span class="ml">${u.best}</span><div class="bar"><i id="meterBar"></i></div><b id="meterTxt"></b></div>
      </div>
    </div>
  </section>
  <div class="stripe thin"></div>
  <div class="wrap">
    <div class="frame" id="watch"><div class="player">${player(topic, u)}</div><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i></div>

    <section class="quiz" id="quiz" aria-live="polite"></section>

    <div class="stop"><span class="oct emoji">✋</span><span>${u.stop}</span></div>
    ${refs ? `<div class="refs"><small>${u.refs}</small>${refs}</div>` : ""}

    <section class="sec">
      <div class="creator">
        <div class="cart"><img src="img/me.webp" alt="${esc(CONFIG.ownerName[lang])}" loading="lazy"></div>
        <div class="txt">
          <small>${u.by}</small>
          <h3 class="display">${esc(CONFIG.ownerName[lang])}</h3>
          <p>${esc(CONFIG.ownerLine?.[lang])}</p>
          <div class="stripe"></div>
        </div>
      </div>
    </section>
  </div>
  <footer>${esc(CONFIG.siteTag?.[lang] || "")}</footer>`;
}

function updateMeter(){
  const n = bestScore(topic), total = QN(topic);
  document.getElementById("meterBar").style.width = (n/total*100) + "%";
  document.getElementById("meterTxt").textContent = `${n}/${total}`;
}

/* ---------- Quiz ---------- */
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let Q = null;   // {order, i, score, picked}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function quizIntro(){
  const u = UI[lang], box = document.getElementById("quiz");
  box.className = "quiz";
  box.innerHTML = `
    <div class="qhead">
      <img class="qicon" src="${art(topic)}" alt="">
      <div><h2>${u.quizTitle}</h2><p>${u.quizSub}</p></div>
    </div>
    <button class="btn qgo" id="qstart">🎯 ${u.startQuiz}</button>`;
  document.getElementById("qstart").onclick = quizStart;
}

/* Draw QUIZ_SIZE questions the worker hasn't seen yet; when the bank runs out,
   start a new cycle but never repeat the previous attempt's questions */
function drawQuestions(){
  const bank = QUIZ[topic.id].map((_, i) => i), key = "seen:" + topic.id, n = QN(topic);
  let seen = []; try{ seen = JSON.parse(store.get(key) || "[]"); }catch(e){}
  let last = []; try{ last = JSON.parse(store.get("last:" + topic.id) || "[]"); }catch(e){}
  let fresh = shuffle(bank.filter(i => !seen.includes(i)));
  let pick = fresh.slice(0, n);
  if(pick.length < n){
    const fill = shuffle(bank.filter(i => !pick.includes(i) && !last.includes(i)));
    pick = pick.concat(fill.slice(0, n - pick.length));
    seen = [];
  }
  store.set(key, JSON.stringify(seen.concat(pick)));
  store.set("last:" + topic.id, JSON.stringify(pick));
  return shuffle(pick);
}

function quizStart(){
  Q = { order: drawQuestions(), i: 0, score: 0, res: [] };
  quizQuestion();
}

function quizQuestion(){
  const u = UI[lang], box = document.getElementById("quiz");
  const item = QUIZ[topic.id][Q.order[Q.i]], t = item[lang], total = QN(topic);
  Q.opts = shuffle(t.o.map((x, k) => ({x, k})));
  box.className = "quiz playing";
  box.innerHTML = `
    <div class="qtop">
      <span>${fmt(u.qOf, {n: Q.i + 1, t: total})}</span>
      <div class="dots">${Array.from({length: total}, (_, k) => `<i class="${k < Q.i ? (Q.res?.[k] ? "ok" : "bad") : k === Q.i ? "now" : ""}"></i>`).join("")}</div>
    </div>
    <h3 class="qq">${esc(t.q)}</h3>
    <div class="opts">${Q.opts.map((o, j) => `<button class="opt" data-j="${j}"><span class="key">${(lang === "en" ? "ABC" : "أبج")[j]}</span><span>${esc(o.x)}</span></button>`).join("")}</div>
    <div class="fb" id="fb"></div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => quizAnswer(+b.dataset.j));
  box.scrollIntoView({block: "nearest", behavior: reduced() ? "auto" : "smooth"});
}

function quizAnswer(j){
  const u = UI[lang], box = document.getElementById("quiz");
  const item = QUIZ[topic.id][Q.order[Q.i]], right = Q.opts[j].k === item.a;
  Q.res = Q.res || []; Q.res[Q.i] = right;
  if(right) Q.score++;
  box.querySelectorAll(".opt").forEach((b, k) => {
    b.disabled = true;
    if(Q.opts[k].k === item.a) b.classList.add("right");
    else if(k === j) b.classList.add("wrong");
  });
  if(navigator.vibrate) navigator.vibrate(right ? 30 : [60, 40, 60]);
  if(right && !reduced()) sparkle(box.querySelectorAll(".opt")[j]);
  const last = Q.i === QN(topic) - 1;
  document.getElementById("fb").innerHTML = `
    <div class="fbin ${right ? "ok" : "bad"}">
      <b>${right ? "✅ " + u.correct : "❌ " + u.wrong}</b>
      <p>${esc(item[lang].e)}</p>
    </div>
    <button class="btn" id="qnext">${last ? u.seeResult : u.nextQ}</button>`;
  document.getElementById("qnext").onclick = () => { if(last) quizResult(); else { Q.i++; quizQuestion(); } };
  document.getElementById("qnext").focus({preventScroll: true});
}

function quizResult(){
  const u = UI[lang], box = document.getElementById("quiz"), total = QN(topic), sc = Q.score, perfect = sc === total;
  if(sc > bestScore(topic)) store.set("best:" + topic.id, String(sc));
  updateMeter();
  const R = 52, C = 2 * Math.PI * R;
  box.className = "quiz result" + (perfect ? " won" : "");
  box.innerHTML = `
    ${perfect
      ? `<div class="trophy emoji">🏆</div>`
      : `<svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" class="bg"/><circle cx="60" cy="60" r="${R}" class="fg" style="stroke-dasharray:${C};stroke-dashoffset:${C}" id="ringFg"/><text x="60" y="68" text-anchor="middle">${sc}/${total}</text></svg>`}
    <h3>${perfect ? u.perfect : u.almost}</h3>
    <p class="sc">${u.yourScore}: <b>${sc}/${total}</b></p>
    <button class="btn" id="qretry">🔁 ${u.retry}</button>`;
  document.getElementById("qretry").onclick = quizStart;
  box.scrollIntoView({block: "center", behavior: reduced() ? "auto" : "smooth"});
  if(!perfect) requestAnimationFrame(() => setTimeout(() => { const f = document.getElementById("ringFg"); if(f) f.style.strokeDashoffset = C * (1 - sc/total); }, 60));
  if(perfect){
    if(navigator.vibrate) navigator.vibrate([50, 40, 50, 40, 120]);
    if(!reduced()) confetti(200);
  }
}

/* Small burst of stars on a right answer */
function sparkle(el){
  const r = el.getBoundingClientRect();
  for(let i = 0; i < 10; i++){
    const s = document.createElement("i");
    s.className = "spark"; s.textContent = ["✦","★","✚"][i % 3];
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random()*50;
    s.style.left = (r.left + r.width/2) + "px"; s.style.top = (r.top + r.height/2) + "px";
    s.style.setProperty("--x", Math.cos(a)*d + "px"); s.style.setProperty("--y", Math.sin(a)*d + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 700);
  }
}

/* Confetti for a perfect score */
function confetti(n){
  const cv = document.createElement("canvas"); cv.className = "confetti";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const colors = ["#D7FF3C", "#05CEB3", "#FF9A4D", "#EAF2FF", "#1A7FE8", "#FF4D57"];
  const ps = Array.from({length: n}, () => ({ x: W/2 + (Math.random()-.5)*80, y: H*.45, vx: (Math.random()-.5)*14, vy: -Math.random()*16 - 6,
    w: 6 + Math.random()*6, h: 8 + Math.random()*8, r: Math.random()*6, vr: (Math.random()-.5)*.3, c: colors[Math.floor(Math.random()*colors.length)] }));
  let t = 0;
  (function tick(){
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore(); });
    if(++t < 180) requestAnimationFrame(tick); else cv.remove();
  })();
}

/* ---------- Shell ---------- */
function render(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = u.dir;
  document.body.className = lang;
  
  document.getElementById("siteName").textContent = u.site;
  document.getElementById("homeLink").href = "./?lang=" + lang;
  document.getElementById("langLbl").textContent = u.lang;
  document.getElementById("app").innerHTML = renderTopic(u);
  updateMeter(); quizIntro();
}

function setLang(l){
  lang = l;
  store.set("lang", l);
  document.getElementById("picker").hidden = true;
  const url = new URL(location.href); url.searchParams.set("lang", l);
  history.replaceState(null, "", url);
  render();
  scrollTo(0, 0);
}

function showPicker(){
  const t = topic || {ar:{title:UI.ar.heroTitle}, en:{title:UI.en.heroTitle}, ur:{title:UI.ur.heroTitle}};
  document.getElementById("pAr").textContent = t.ar.title;
  document.getElementById("pEn").textContent = t.en.title;
  document.getElementById("pUr").textContent = t.ur.title;
  document.getElementById("picker").hidden = false;
}

document.querySelectorAll("#picker [data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.getElementById("langBtn").onclick = showPicker;

/* Start: a QR scan opens with no ?lang=, so the visitor always picks a language first.
   After that, ?lang= in the URL keeps the choice on reload and in-page links. */
const start = params.get("lang");
if(UI[start]) setLang(start); else { lang = "ar"; render(); showPicker(); }
</script>
</body>
</html>
